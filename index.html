<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASRAS Material Raw</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#f0f2f5;color:#1c2530;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .container{max-width:400px;width:100%;padding:20px}
        .card{background:#fff;border-radius:16px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
        .logo{text-align:center;margin-bottom:24px}
        .logo .big{display:inline-block;background:#1a2a3a;color:#fff;padding:12px 20px;border-radius:12px;font-size:24px;font-weight:900}
        .logo h2{font-size:20px;margin-top:12px}
        .logo p{color:#5b6b81;font-size:13px}
        label{display:block;font-size:13px;font-weight:700;color:#3d4a5c;margin:12px 0 4px}
        input{width:100%;padding:10px 12px;border:1px solid #dde2e8;border-radius:10px;font-size:14px}
        input:focus{outline:none;border-color:#c08a2e}
        .btn{width:100%;padding:12px;border:none;border-radius:10px;background:#1a2a3a;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px}
        .btn:hover{background:#2c3e50}
        .btn-gold{background:#c08a2e}
        .btn-gold:hover{background:#a77520}
        .sub{text-align:center;color:#5b6b81;font-size:13px;margin-top:12px}
        .sub a{color:#c08a2e;font-weight:700;text-decoration:none}
        .hidden{display:none!important}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2a3a;color:#fff;padding:10px 24px;border-radius:30px;font-size:13px;z-index:100;opacity:0;transition:all 0.3s;pointer-events:none}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
        .dashboard{max-width:820px;margin:0 auto;padding:16px}
        .header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid #dde2e8;flex-wrap:wrap;gap:10px}
        .brand{display:flex;align-items:center;gap:10px}
        .brand-icon{background:#1a2a3a;color:#fff;padding:8px 14px;border-radius:10px;font-weight:900;font-size:18px}
        .brand h1{font-size:16px}
        .brand p{font-size:11px;color:#5b6b81}
        .user-info{display:flex;align-items:center;gap:10px;font-size:13px}
        .user-info button{background:#b23b3b;color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:700}
        .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid #dde2e8;flex-wrap:wrap}
        .tab{padding:8px 16px;border-radius:10px;border:none;background:none;font-weight:700;cursor:pointer;font-size:13px;color:#5b6b81}
        .tab.active{background:#1a2a3a;color:#fff}
        .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0}
        .stat{background:#fff;border:1px solid #dde2e8;border-radius:12px;padding:12px;text-align:center}
        .stat b{font-size:20px;display:block}
        .stat span{font-size:11px;color:#5b6b81}
        .order-item{background:#fff;border:1px solid #dde2e8;border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
        .order-item:hover{border-color:#c08a2e}
        .order-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
        .order-name{font-weight:700}
        .order-meta{font-size:12px;color:#5b6b81}
        .pill{font-size:11px;font-weight:700;padding:2px 12px;border-radius:20px;background:#faf1de;color:#c08a2e}
        .pill.delivered{background:#e4f2ee;color:#2b7a6c}
        .empty{text-align:center;padding:30px;color:#5b6b81}
        .footer{text-align:center;padding:20px 0;font-size:11px;color:#5b6b81;border-top:1px solid #dde2e8;margin-top:20px}
        .footer strong{color:#c08a2e}
        @media(max-width:600px){.container{padding:10px}}
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <!-- ===== LOGIN ===== -->
    <div id="loginContainer" class="container">
        <div class="card">
            <div class="logo">
                <div class="big">RAS</div>
                <h2>رصرص للتوكيلات التجارية</h2>
                <p>RASRAS Material Raw</p>
            </div>
            <div id="loginForm">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="admin@rasras.com">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="********">
                <button class="btn btn-gold" id="loginBtn">دخول</button>
                <div class="sub">ليس لديك حساب؟ <a href="#" id="showRegisterBtn">سجل الآن</a></div>
            </div>
            <div id="registerForm" class="hidden">
                <label>البريد الإلكتروني</label>
                <input type="email" id="regEmail" placeholder="admin@rasras.com">
                <label>كلمة المرور</label>
                <input type="password" id="regPassword" placeholder="********">
                <button class="btn btn-gold" id="registerBtn">إنشاء حساب</button>
                <div class="sub">لديك حساب؟ <a href="#" id="showLoginBtn">سجل دخول</a></div>
            </div>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="appContainer" class="hidden">
        <div class="dashboard">
            <div class="header">
                <div class="brand">
                    <div class="brand-icon">RAS</div>
                    <div><h1>رصرص للتوكيلات التجارية</h1><p>RASRAS Material Raw · نظام الطلبات</p></div>
                </div>
                <div class="user-info">
                    <span id="userEmailDisplay">user@email.com</span>
                    <button id="logoutBtn">تسجيل خروج</button>
                </div>
            </div>
            <div class="tabs" id="tabsContainer">
                <button class="tab active" data-tab="dashboard">📊 الرئيسية</button>
                <button class="tab" data-tab="new">➕ طلب جديد</button>
                <button class="tab" data-tab="orders">📋 الطلبات</button>
            </div>
            <div id="viewDashboard" class="view"></div>
            <div id="viewNew" class="view hidden"></div>
            <div id="viewOrders" class="view hidden"></div>
            <div class="footer">© 2026 <strong>RASRAS Material Raw</strong> - رصرص للتوكيلات التجارية</div>
        </div>
    </div>

    <script type="module">
        import { Client, Account, Databases, ID } from "https://cdn.jsdelivr.net/npm/appwrite@latest";
        const PROJECT_ID = '6a98cf310022ce38f1c4';
        const DATABASE_ID = 'orders_db';
        const COLLECTION_ID = 'orders_collection';
        const client = new Client().setEndpoint('https://fra.cloud.appwrite.io/v1').setProject(PROJECT_ID);
        const account = new Account(client);
        const databases = new Databases(client);
        window.account = account; window.databases = databases; window.client = client; window.ID = ID;

        const state = { user: null, orders: [], currentTab: 'dashboard', draft: { customerName: '', phone: '', address: '', items: [{ name: '', qty: 1, price: 0 }], paymentMethod: 'نقدي', willCollect: true, collectAmount: 0, notes: '' } };

        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000); }
        function fmtMoney(n) { return Number(n || 0).toLocaleString('ar-EG') + ' ج.م'; }
        function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }); }
        function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function generateOrderId() { return 'RAS-' + String(Date.now()).slice(-8) + '-' + String(Math.floor(Math.random() * 9000) + 1000); }

        async function loadOrders() {
            try { const response = await databases.listDocuments(DATABASE_ID, COLLECTION_ID); state.orders = response.documents.map(d => ({ ...d, $id: d.$id })); renderAll(); } catch (e) { state.orders = []; renderAll(); }
        }
        async function createOrder(orderData) {
            try { const doc = await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), orderData); state.orders.unshift(doc); renderAll(); showToast('✅ تم إنشاء الطلب'); return doc; } catch (e) { showToast('❌ ' + e.message); return null; }
        }

        async function checkUser() {
            try { const user = await account.get(); state.user = user; document.getElementById('loginContainer').classList.add('hidden'); document.getElementById('appContainer').classList.remove('hidden'); document.getElementById('userEmailDisplay').textContent = user.email; await loadOrders(); } catch (e) { state.user = null; document.getElementById('loginContainer').classList.remove('hidden'); document.getElementById('appContainer').classList.add('hidden'); }
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            try { await account.createEmailPasswordSession(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); showToast('✅ مرحباً!'); checkUser(); } catch (e) { showToast('❌ ' + e.message); }
        });
        document.getElementById('registerBtn').addEventListener('click', async () => {
            try { await account.create(ID.unique(), document.getElementById('regEmail').value, document.getElementById('regPassword').value); showToast('✅ تم إنشاء الحساب، سجل دخول'); document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); } catch (e) { showToast('❌ ' + e.message); }
        });
        document.getElementById('showRegisterBtn').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); });
        document.getElementById('showLoginBtn').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); });
        document.getElementById('logoutBtn').addEventListener('click', async () => { try { await account.deleteSession('current'); state.user = null; showToast('👋 تم تسجيل الخروج'); checkUser(); } catch (e) { showToast('❌ ' + e.message); } });

        function renderAll() { renderDashboard(); renderOrders(); renderNewOrder(); updateTabs(); }
        function updateTabs() {
            document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === state.currentTab));
            document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
            const map = { 'dashboard':'viewDashboard','new':'viewNew','orders':'viewOrders' };
            const target = document.getElementById(map[state.currentTab]);
            if (target) target.classList.remove('hidden');
        }

        function renderDashboard() {
            const el = document.getElementById('viewDashboard');
            const total = state.orders.length;
            const delivered = state.orders.filter(o => o.status === 'delivered').length;
            const pending = state.orders.filter(o => o.status !== 'delivered').length;
            const recent = state.orders.slice(0, 5);
            el.innerHTML = `
            <div class="stat-row">
              <div class="stat"><b>${total}</b><span>إجمالي الطلبات</span></div>
              <div class="stat"><b>${pending}</b><span>قيد التنفيذ</span></div>
              <div class="stat"><b>${delivered}</b><span>تم التسليم</span></div>
            </div>
            <h2 style="font-size:14px;font-weight:700;margin:14px 0 8px;">📋 آخر الطلبات</h2>
            ${recent.length === 0 ? '<div class="empty">لا توجد طلبات</div>' : recent.map(o => `
              <div class="order-item" data-order-id="${o.$id}">
                <div class="order-top">
                  <div><div class="order-name">${escapeHtml(o.customerName)}</div><div class="order-meta">${fmtDate(o.createdAt)} · ${fmtMoney(o.collectAmount)}</div></div>
                  <span class="pill ${o.status === 'delivered' ? 'delivered' : ''}">${o.status === 'delivered' ? 'تم التسليم' : 'قيد التنفيذ'}</span>
                </div>
              </div>
            `).join('')}
          `;
            document.querySelectorAll('.order-item').forEach(el => {
                el.addEventListener('click', () => { showToast('📋 تفاصيل الطلب: ' + el.dataset.orderId); });
            });
        }

        function renderOrders() {
            const el = document.getElementById('viewOrders');
            const list = state.orders;
            el.innerHTML = `
            <h2 style="font-size:14px;font-weight:700;margin:14px 0 8px;">📋 جميع الطلبات (${list.length})</h2>
            ${list.length === 0 ? '<div class="empty">لا توجد طلبات</div>' : list.map(o => `
              <div class="order-item">
                <div class="order-top">
                  <div><div class="order-name">${escapeHtml(o.customerName)}</div><div class="order-meta">${fmtDate(o.createdAt)} · ${fmtMoney(o.collectAmount)}</div></div>
                  <span class="pill ${o.status === 'delivered' ? 'delivered' : ''}">${o.status === 'delivered' ? 'تم التسليم' : 'قيد التنفيذ'}</span>
                </div>
              </div>
            `).join('')}
          `;
        }

        function renderNewOrder() {
            const el = document.getElementById('viewNew');
            const d = state.draft;
            el.innerHTML = `
            <div class="card" style="background:#fff;border-radius:12px;padding:16px;border:1px solid #dde2e8;margin-top:14px;">
              <h2 style="font-size:16px;margin-bottom:12px;">➕ طلب جديد</h2>
              <label>👤 اسم العميل</label>
              <input type="text" id="f_customer" value="${escapeHtml(d.customerName)}" placeholder="اسم العميل">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div><label>📞 التليفون</label><input type="tel" id="f_phone" value="${escapeHtml(d.phone)}" placeholder="01xxxxxxxxx"></div>
                <div><label>📍 العنوان</label><input type="text" id="f_address" value="${escapeHtml(d.address)}" placeholder="العنوان"></div>
              </div>
              <label>📦 الأصناف</label>
              <div id="itemsWrap">
                ${d.items.map((it, idx) => `
                  <div style="display:grid;grid-template-columns:1fr 80px 80px 30px;gap:6px;margin-bottom:6px;" data-idx="${idx}">
                    <input type="text" placeholder="اسم الصنف" data-field="name" value="${escapeHtml(it.name)}">
                    <input type="number" placeholder="كمية" data-field="qty" value="${it.qty}" min="1">
                    <input type="number" placeholder="سعر" data-field="price" value="${it.price}" min="0">
                    <button style="background:#b23b3b;color:#fff;border:none;border-radius:8px;cursor:pointer;" data-rm="${idx}">✕</button>
                  </div>
                `).join('')}
              </div>
              <button style="background:#dde2e8;border:none;padding:8px;border-radius:8px;width:100%;cursor:pointer;font-weight:700;" id="addItemBtn">+ إضافة صنف</button>
              <label>💰 طريقة الدفع</label>
              <select id="f_payment"><option value="نقدي">نقدي</option><option value="آجل">آجل</option></select>
              <label>💰 المبلغ المستلم</label>
              <input type="number" id="f_collectAmount" value="${d.collectAmount || 0}" min="0">
              <label>📝 ملاحظات</label>
              <textarea id="f_notes" rows="2">${escapeHtml(d.notes)}</textarea>
              <button class="btn" id="submitOrderBtn">🚀 إنشاء الطلب</button>
            </div>
          `;
            bindNewOrderEvents();
        }

        function bindNewOrderEvents() {
            const d = state.draft;
            document.getElementById('f_customer')?.addEventListener('input', e => d.customerName = e.target.value);
            document.getElementById('f_phone')?.addEventListener('input', e => d.phone = e.target.value);
            document.getElementById('f_address')?.addEventListener('input', e => d.address = e.target.value);
            document.getElementById('f_notes')?.addEventListener('input', e => d.notes = e.target.value);
            document.getElementById('f_payment')?.addEventListener('change', e => d.paymentMethod = e.target.value);
            document.getElementById('f_collectAmount')?.addEventListener('input', e => d.collectAmount = Number(e.target.value) || 0);
            document.querySelectorAll('#itemsWrap > div').forEach(row => {
                const idx = Number(row.dataset.idx);
                row.querySelectorAll('input[data-field]').forEach(inp => {
                    inp.addEventListener('input', () => { const field = inp.dataset.field; d.items[idx][field] = field === 'name' ? inp.value : Number(inp.value) || 0; });
                });
                row.querySelector('[data-rm]')?.addEventListener('click', () => { if (d.items.length > 1) { d.items.splice(idx, 1); renderNewOrder(); } });
            });
            document.getElementById('addItemBtn')?.addEventListener('click', () => { d.items.push({ name: '', qty: 1, price: 0 }); renderNewOrder(); });
            document.getElementById('submitOrderBtn')?.addEventListener('click', async () => {
                if (!d.customerName.trim()) { showToast('❌ أدخل اسم العميل'); return; }
                const cleanItems = d.items.filter(i => i.name.trim() && i.qty > 0);
                if (cleanItems.length === 0) { showToast('❌ أضف صنف'); return; }
                d.items = cleanItems;
                const doc = await createOrder({
                    orderId: generateOrderId(),
                    customerName: d.customerName.trim(),
                    phone: d.phone.trim(),
                    address: d.address.trim(),
                    items: d.items,
                    paymentMethod: d.paymentMethod,
                    collectAmount: d.collectAmount || 0,
                    notes: d.notes || '',
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    createdBy: state.user?.email || 'unknown'
                });
                if (doc) {
                    state.draft = { customerName: '', phone: '', address: '', items: [{ name: '', qty: 1, price: 0 }], paymentMethod: 'نقدي', willCollect: true, collectAmount: 0, notes: '' };
                    state.currentTab = 'orders';
                    renderAll();
                }
            });
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => { state.currentTab = tab.dataset.tab; renderAll(); });
        });

        checkUser();
    </script>
</body>
</html>
