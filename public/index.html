<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رصرص للتوكيلات التجارية - نظام الإدارة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: #f0f2f5;
            direction: rtl;
        }
        
        :root {
            --primary: #1a2a3a;
            --gold: #c9a84c;
            --gold-dark: #a8892e;
            --gold-light: #f5e6b8;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 12px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Login */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), #2c3e50);
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        
        .login-card .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-card .logo h1 {
            font-size: 24px;
            color: var(--primary);
            font-weight: 900;
        }
        
        .login-card .logo p {
            color: #7f8c8d;
            font-size: 13px;
        }
        
        .login-card .logo .brand {
            width: 72px;
            height: 72px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 32px;
            font-weight: 900;
            color: white;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf0;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: var(--radius);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 168, 76, 0.3);
        }
        
        /* Header */
        .header {
            background: white;
            border-radius: var(--radius);
            padding: 16px 24px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-brand .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 20px;
        }
        
        .header-brand h2 {
            font-size: 16px;
            font-weight: 800;
        }
        
        .header-brand span {
            font-size: 11px;
            color: #7f8c8d;
        }
        
        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #f8f9fa;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .user-info .avatar {
            width: 30px;
            height: 30px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 12px;
        }
        
        .btn-logout {
            padding: 8px 16px;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            background: none;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: #7f8c8d;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
        }
        
        .stat-card .label {
            font-size: 13px;
            color: #7f8c8d;
            font-weight: 600;
            margin-top: 4px;
        }
        
        .stat-card.gold .number { color: var(--gold-dark); }
        .stat-card.green .number { color: var(--success); }
        .stat-card.red .number { color: var(--danger); }
        .stat-card.blue .number { color: #3498db; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            background: white;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .tab:hover {
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: var(--primary);
            color: white;
        }
        
        .tab .badge {
            background: var(--danger);
            color: white;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 10px;
            margin-right: 6px;
        }
        
        /* Order Cards */
        .order-card {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border-right: 4px solid var(--gold);
            transition: all 0.3s;
        }
        
        .order-card:hover {
            transform: translateX(-4px);
        }
        
        .order-card .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0;
            box-shadow: none;
            background: none;
        }
        
        .order-card .order-id {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
        }
        
        .order-card .order-name {
            font-size: 16px;
            font-weight: 700;
        }
        
        .order-card .order-meta {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .status-badge {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }
        
        .status-sales_created { background: #e8ecf0; color: #5a6a7a; }
        .status-logistics_review { background: #fef9e7; color: #b7950b; }
        .status-accounts_approval { background: #fef9e7; color: #b7950b; }
        .status-warehouse_release { background: #eafaf1; color: #1a7a5a; }
        .status-with_driver { background: #d5f5e3; color: #1a7a5a; }
        .status-delivered { background: var(--primary); color: white; }
        
        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-whatsapp:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        
        .btn-driver {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-driver-delivered {
            background: var(--success);
            color: white;
        }
        
        .btn-driver-not-delivered {
            background: var(--danger);
            color: white;
        }
        
        .btn-driver-problem {
            background: var(--warning);
            color: white;
        }
        
        .btn-driver:hover {
            transform: scale(1.02);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-8px);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal .modal-header h3 {
            font-size: 18px;
        }
        
        .modal .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f8f9fa;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal .modal-close:hover {
            background: var(--danger);
            color: white;
        }
        
        .modal .form-group {
            margin-bottom: 16px;
        }
        
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .modal .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header { flex-direction: column; align-items: stretch; }
            .header-user { justify-content: space-between; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .login-card { padding: 32px 24px; }
            .order-card .header { flex-direction: column; }
        }
        
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card { padding: 14px; }
            .stat-card .number { font-size: 22px; }
            .tabs { gap: 4px; }
            .tab { padding: 8px 14px; font-size: 12px; }
            .order-actions { flex-direction: column; }
            .btn-whatsapp, .btn-driver { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="toast" id="toast"></div>

    <script>
        // ============ API Client ============
        const API = {
            async request(endpoint, options = {}) {
                const response = await fetch(`/api${endpoint}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(options.headers || {})
                    }
                });
                return response.json();
            },
            
            async login(username, password) {
                return this.request('/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
            },
            
            async getData() {
                return this.request('/data');
            },
            
            async getStats() {
                return this.request('/stats');
            },
            
            async createOrder(order) {
                return this.request('/orders', {
                    method: 'POST',
                    body: JSON.stringify(order)
                });
            },
            
            async updateOrder(id, data) {
                return this.request(`/orders/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
            },
            
            async updateDriverStatus(id, status, note) {
                return this.request(`/orders/${id}/driver-status`, {
                    method: 'POST',
                    body: JSON.stringify({ status, note })
                });
            },
            
            async sendWhatsApp(orderId, phone, message) {
                return this.request('/whatsapp/send', {
                    method: 'POST',
                    body: JSON.stringify({ orderId, phone, message })
                });
            }
        };

        // ============ State ============
        let state = {
            user: null,
            data: null,
            view: 'dashboard',
            loading: false
        };

        // ============ Helpers ============
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function formatDate(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatMoney(n) {
            return Number(n || 0).toLocaleString('ar-EG') + ' ج.م';
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        function getStageLabel(stage) {
            const stages = {
                'sales_created': 'تم الإنشاء',
                'logistics_review': 'مراجعة النقل',
                'accounts_approval': 'اعتماد الحسابات',
                'warehouse_release': 'إذن الصرف',
                'with_driver': 'مع السائق',
                'delivered': 'تم التسليم'
            };
            return stages[stage] || stage;
        }

        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').substring(0, 2);
        }

        // ============ Render Functions ============

        function render() {
            const app = document.getElementById('app');
            
            if (!state.user) {
                app.innerHTML = renderLogin();
                bindLoginEvents();
                return;
            }
            
            if (!state.data) {
                app.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>جارِ تحميل البيانات...</p></div>';
                loadData();
                return;
            }
            
            app.innerHTML = `
                ${renderHeader()}
                <div class="container">
                    ${renderStats()}
                    ${renderTabs()}
                    ${renderView()}
                </div>
            `;
            
            bindEvents();
        }

        // ============ Login ============
        function renderLogin() {
            return `
                <div class="login-page">
                    <div class="login-card">
                        <div class="logo">
                            <div class="brand">R</div>
                            <h1>رصرص للتوكيلات التجارية</h1>
                            <p>Rasras for Commercial Agencies</p>
                        </div>
                        <div class="form-group">
                            <label>اسم المستخدم</label>
                            <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم" value="admin">
                        </div>
                        <div class="form-group">
                            <label>كلمة المرور</label>
                            <input type="password" id="loginPass" placeholder="أدخل كلمة المرور" value="admin123">
                        </div>
                        <button class="btn-primary" id="loginBtn">تسجيل الدخول</button>
                        <div style="text-align:center;margin-top:16px;font-size:11px;color:#7f8c8d;">
                            <p>🔑 admin / admin123 | sales / sales123</p>
                            <p>logistics / log123 | accounts / acc123</p>
                            <p>warehouse / ware123 | driver1 / driver123</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function bindLoginEvents() {
            const loginBtn = document.getElementById('loginBtn');
            const loginUser = document.getElementById('loginUser');
            const loginPass = document.getElementById('loginPass');
            
            const doLogin = async () => {
                const username = loginUser.value.trim();
                const password = loginPass.value.trim();
                if (!username || !password) {
                    showToast('يرجى إدخال اسم المستخدم وكلمة المرور');
                    return;
                }
                
                try {
                    const result = await API.login(username, password);
                    if (result.success) {
                        state.user = result.user;
                        showToast(`مرحباً ${result.user.name}`);
                        render();
                    } else {
                        showToast(result.message || 'بيانات الدخول غير صحيحة');
                    }
                } catch (error) {
                    showToast('حدث خطأ في الاتصال بالخادم');
                }
            };
            
            loginBtn.onclick = doLogin;
            loginPass.onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
            loginUser.onkeydown = (e) => { if (e.key === 'Enter') loginPass.focus(); };
        }

        // ============ Header ============
        function renderHeader() {
            const initials = getInitials(state.user.name);
            const roleLabels = {
                admin: 'مدير النظام',
                sales: 'المبيعات',
                logistics: 'النقل',
                accounts: 'الحسابات',
                warehouse: 'المخازن',
                driver: 'سائق'
            };
            
            return `
                <div class="container">
                    <div class="header">
                        <div class="header-brand">
                            <div class="brand-icon">R</div>
                            <div>
                                <h2>رصرص للتوكيلات التجارية</h2>
                                <span>Rasras for Commercial Agencies</span>
                            </div>
                        </div>
                        <div class="header-user">
                            <div class="user-info">
                                <div class="avatar">${initials}</div>
                                ${state.user.name} · ${roleLabels[state.user.role] || state.user.role}
                            </div>
                            <button class="btn-logout" id="logoutBtn">تسجيل خروج</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============ Stats ============
        function renderStats() {
            const orders = state.data.orders || [];
            const total = orders.length;
            const pending = orders.filter(o => o.stage !== 'delivered').length;
            const delivered = orders.filter(o => o.stage === 'delivered').length;
            const myTasks = getMyTasks().length;
            
            return `
                <div class="stats-grid">
                    <div class="stat-card gold">
                        <div class="number">${total}</div>
                        <div class="label">📦 إجمالي الأوامر</div>
                    </div>
                    <div class="stat-card blue">
                        <div class="number">${pending}</div>
                        <div class="label">⏳ قيد التنفيذ</div>
                    </div>
                    <div class="stat-card green">
                        <div class="number">${delivered}</div>
                        <div class="label">✅ تم التسليم</div>
                    </div>
                    <div class="stat-card red">
                        <div class="number">${myTasks}</div>
                        <div class="label">📋 مهامي</div>
                    </div>
                </div>
            `;
        }

        function getMyTasks() {
            const role = state.user.role;
            const orders = state.data.orders || [];
            
            if (role === 'driver') {
                return orders.filter(o => o.driverName === state.user.name && o.stage === 'with_driver');
            }
            if (role === 'sales') return orders.filter(o => o.stage === 'sales_created');
            if (role === 'logistics') return orders.filter(o => o.stage === 'logistics_review');
            if (role === 'accounts') return orders.filter(o => o.stage === 'accounts_approval');
            if (role === 'warehouse') return orders.filter(o => o.stage === 'warehouse_release');
            return orders.filter(o => o.stage !== 'delivered');
        }

        // ============ Tabs ============
        function renderTabs() {
            const role = state.user.role;
            const tabs = [];
            const myTasks = getMyTasks();
            
            tabs.push({ id: 'dashboard', label: '📊 الرئيسية' });
            
            if (role === 'sales' || role === 'admin') {
                tabs.push({ id: 'new', label: '➕ أمر جديد' });
            }
            
            if (role === 'driver') {
                tabs.push({ id: 'my_orders', label: '🚚 شحناتي', badge: myTasks.length });
            } else {
                tabs.push({ id: 'my_tasks', label: '📋 مهامي', badge: myTasks.length });
            }
            
            if (role === 'admin' || role === 'sales') {
                tabs.push({ id: 'customers', label: '👥 العملاء' });
            }
            
            return `
                <div class="tabs">
                    ${tabs.map(t => `
                        <button class="tab ${state.view === t.id ? 'active' : ''}" data-tab="${t.id}">
                            ${t.label}
                            ${t.badge ? `<span class="badge">${t.badge}</span>` : ''}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        // ============ View ============
        function renderView() {
            switch (state.view) {
                case 'dashboard': return renderDashboard();
                case 'new': return renderNewOrder();
                case 'my_tasks': return renderMyTasks();
                case 'my_orders': return renderMyOrders();
                case 'customers': return renderCustomers();
                default: return renderDashboard();
            }
        }

        // ============ Dashboard ============
        function renderDashboard() {
            const orders = (state.data.orders || []).slice(0, 10);
            
            if (orders.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>لا توجد أوامر حالياً</p>
                        <p style="font-size:13px;margin-top:4px;">ابدأ بإنشاء أمر جديد من تبويب "أمر جديد"</p>
                    </div>
                `;
            }
            
            return `
                <h3 style="margin-bottom:16px;">📦 أحدث الأوامر</h3>
                ${orders.map(o => renderOrderCard(o)).join('')}
            `;
        }

        // ============ Order Card ============
        function renderOrderCard(order) {
            const total = order.finalTotal || order.items.reduce((s, i) => s + i.qty * i.price, 0) + (order.shippingCost || 0);
            const isDriver = state.user.role === 'driver' && order.driverName === state.user.name && order.stage === 'with_driver';
            
            let actions = '';
            
            if (isDriver) {
                actions = `
                    <div class="order-actions">
                        <button class="btn-driver btn-driver-delivered" onclick="handleDriverStatus('${order.id}', 'delivered', 'تم التسليم بنجاح')">
                            ✅ تم التسليم
                        </button>
                        <button class="btn-driver btn-driver-not-delivered" onclick="handleDriverStatus('${order.id}', 'not_delivered', 'لم يتم التسليم')">
                            ❌ لم يتم التسليم
                        </button>
                        <button class="btn-driver btn-driver-problem" onclick="handleDriverStatus('${order.id}', 'problem', 'يوجد مشكلة')">
                            ⚠️ مشكلة
                        </button>
                    </div>
                `;
            }
            
            const whatsappBtn = (order.driverPhone && (order.stage === 'with_driver' || order.stage === 'delivered'))
                ? `<button class="btn-whatsapp" onclick="handleWhatsApp('${order.id}')">
                    💬 إرسال للسائق
                </button>`
                : '';
            
            const stageLabel = getStageLabel(order.stage);
            
            return `
                <div class="order-card">
                    <div class="header">
                        <div>
                            <div class="order-id">${order.id} · ${order.type === 'sale' ? 'أمر بيع' : 'أمر شراء'}</div>
                            <div class="order-name">${escapeHtml(order.partyName)}</div>
                            <div class="order-meta">${formatDate(order.createdAt)} · ${formatMoney(total)} · ${order.paymentMethod}</div>
                        </div>
                        <span class="status-badge status-${order.stage}">${stageLabel}</span>
                    </div>
                    ${whatsappBtn}
                    ${actions}
                </div>
            `;
        }

        // ============ My Tasks ============
        function renderMyTasks() {
            const tasks = getMyTasks();
            
            if (tasks.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="icon">✨</div>
                        <p>لا توجد مهام حالياً</p>
                    </div>
                `;
            }
            
            return tasks.map(o => renderOrderCard(o)).join('');
        }

        // ============ My Orders (Driver) ============
        function renderMyOrders() {
            const orders = (state.data.orders || []).filter(o => o.driverName === state.user.name);
            
            if (orders.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="icon">🚚</div>
                        <p>لا توجد شحنات مسندة إليك</p>
                    </div>
                `;
            }
            
            return orders.map(o => renderOrderCard(o)).join('');
        }

        // ============ Customers ============
        function renderCustomers() {
            const customers = state.data.customers || [];
            const suppliers = state.data.suppliers || [];
            
            if (customers.length === 0 && suppliers.length === 0) {
                return `
                    <div class="empty-state">
                        <div class="icon">👥</div>
                        <p>لا يوجد عملاء أو موردون</p>
                    </div>
                `;
            }
            
            const all = [
                ...customers.map(c => ({ ...c, type: 'عميل' })),
                ...suppliers.map(s => ({ ...s, type: 'مورد' }))
            ];
            
            return `
                <h3 style="margin-bottom:16px;">👥 العملاء والموردين</h3>
                ${all.map(p => `
                    <div class="order-card" style="border-right-color: ${p.type === 'عميل' ? '#3498db' : '#2ecc71'};">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                            <div>
                                <div style="font-weight:700;font-size:16px;">${escapeHtml(p.name)}</div>
                                <div style="font-size:13px;color:#7f8c8d;">${p.type} · ${escapeHtml(p.phone)}</div>
                                <div style="font-size:12px;color:#7f8c8d;">📦 ${(p.orderIds || []).length} طلب</div>
                            </div>
                            <span style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;background:#f8f9fa;">
                                ${p.type}
                            </span>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        // ============ New Order ============
        function renderNewOrder() {
            return `
                <div class="order-card" style="border-right-color: var(--gold);">
                    <h3 style="margin-bottom:16px;">➕ إنشاء أمر جديد</h3>
                    
                    <div style="display:flex;gap:10px;margin-bottom:16px;">
                        <button class="tab ${state.orderType === 'sale' ? 'active' : ''}" style="flex:1;text-align:center;" onclick="setOrderType('sale')">أمر بيع</button>
                        <button class="tab ${state.orderType === 'purchase' ? 'active' : ''}" style="flex:1;text-align:center;" onclick="setOrderType('purchase')">أمر شراء</button>
                    </div>
                    
                    <div id="newOrderForm">
                        <div class="form-group">
                            <label>${state.orderType === 'sale' ? 'اسم العميل' : 'اسم المورد'}</label>
                            <input type="text" id="partyName" placeholder="أدخل الاسم">
                        </div>
                        <div class="form-group">
                            <label>رقم التليفون</label>
                            <input type="tel" id="phone" placeholder="أدخل رقم التليفون">
                        </div>
                        <div class="form-group">
                            <label>العنوان</label>
                            <input type="text" id="address" placeholder="أدخل العنوان">
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                            <div class="form-group">
                                <label>طريقة الدفع</label>
                                <select id="paymentMethod">
                                    <option value="نقدي">نقدي</option>
                                    <option value="شيك">شيك</option>
                                    <option value="تحويل بنكي">تحويل بنكي</option>
                                    <option value="آجل">آجل</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>فاتورة ضريبية</label>
                                <select id="taxInvoice">
                                    <option value="true">نعم</option>
                                    <option value="false">لا</option>
                                </select>
                            </div>
                        </div>
                        
                        <div style="border-top:2px solid #e8ecf0;padding-top:16px;margin-top:8px;">
                            <label style="font-weight:700;display:block;margin-bottom:8px;">📦 الأصناف</label>
                            <div id="itemsContainer">
                                <div class="item-row" style="display:grid;grid-template-columns:1fr 80px 100px 30px;gap:8px;margin-bottom:6px;">
                                    <input type="text" class="item-name" placeholder="اسم الصنف">
                                    <input type="number" class="item-qty" placeholder="الكمية" value="1">
                                    <input type="number" class="item-price" placeholder="السعر" value="0">
                                    <button class="remove-item" style="background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-size:18px;">×</button>
                                </div>
                            </div>
                            <button onclick="addItemRow()" style="padding:10px;border:2px dashed #e8ecf0;border-radius:12px;background:none;width:100%;font-family:inherit;font-weight:600;color:#7f8c8d;cursor:pointer;margin-top:4px;">
                                + إضافة صنف
                            </button>
                        </div>
                        
                        <button class="btn-primary" style="margin-top:16px;" onclick="submitOrder()">
                            🚀 إنشاء الأمر وتحويله للنقل
                        </button>
                    </div>
                </div>
            `;
        }

        // ============ Order Actions ============
        let orderType = 'sale';

        function setOrderType(type) {
            orderType = type;
            state.orderType = type;
            render();
        }

        function addItemRow() {
            const container = document.getElementById('itemsContainer');
            const row = document.createElement('div');
            row.className = 'item-row';
            row.style.cssText = 'display:grid;grid-template-columns:1fr 80px 100px 30px;gap:8px;margin-bottom:6px;';
            row.innerHTML = `
                <input type="text" class="item-name" placeholder="اسم الصنف">
                <input type="number" class="item-qty" placeholder="الكمية" value="1">
                <input type="number" class="item-price" placeholder="السعر" value="0">
                <button class="remove-item" style="background:var(--danger);color:white;border:none;border-radius:8px;cursor:pointer;font-size:18px;" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        }

        async function submitOrder() {
            const partyName = document.getElementById('partyName')?.value.trim();
            const phone = document.getElementById('phone')?.value.trim();
            const address = document.getElementById('address')?.value.trim();
            const paymentMethod = document.getElementById('paymentMethod')?.value;
            const taxInvoice = document.getElementById('taxInvoice')?.value === 'true';
            
            if (!partyName) { showToast('يرجى إدخال اسم ' + (orderType === 'sale' ? 'العميل' : 'المورد')); return; }
            if (!phone) { showToast('يرجى إدخال رقم التليفون'); return; }
            
            const itemRows = document.querySelectorAll('.item-row');
            const items = [];
            let hasItems = false;
            
            itemRows.forEach(row => {
                const name = row.querySelector('.item-name')?.value.trim();
                const qty = parseInt(row.querySelector('.item-qty')?.value) || 0;
                const price = parseFloat(row.querySelector('.item-price')?.value) || 0;
                if (name) {
                    items.push({ name, qty, price });
                    hasItems = true;
                }
            });
            
            if (!hasItems) { showToast('أضف صنف واحد على الأقل'); return; }
            
            const order = {
                type: orderType,
                partyName,
                phone,
                address: address || '',
                paymentMethod,
                taxInvoice,
                items,
                createdBy: state.user.name,
                shippingCost: 0,
                finalTotal: items.reduce((s, i) => s + i.qty * i.price, 0)
            };
            
            try {
                const result = await API.createOrder(order);
                showToast('✅ تم إنشاء الأمر بنجاح وتحويله للنقل');
                state.view = 'dashboard';
                await loadData();
                render();
            } catch (error) {
                showToast('حدث خطأ أثناء إنشاء الأمر');
            }
        }

        // ============ Driver Actions ============
        async function handleDriverStatus(orderId, status, note) {
            try {
                await API.updateDriverStatus(orderId, status, note);
                showToast('✅ تم تحديث حالة الشحنة');
                await loadData();
                render();
            } catch (error) {
                showToast('حدث خطأ أثناء تحديث الحالة');
            }
        }

        // ============ WhatsApp ============
        function buildWhatsAppMessage(order) {
            const total = order.finalTotal || order.items.reduce((s, i) => s + i.qty * i.price, 0) + (order.shippingCost || 0);
            const itemsText = order.items.map(i => `• ${i.name} × ${i.qty} = ${formatMoney(i.qty * i.price)}`).join('\n');
            const typeLabel = order.type === 'sale' ? 'أمر بيع' : 'أمر شراء';
            
            return `🚚 *رصرص للتوكيلات التجارية*\n` +
                `*${typeLabel} #${order.id}*\n\n` +
                `👤 العميل: ${order.partyName}\n` +
                `📞 التليفون: ${order.phone}\n` +
                `📍 العنوان: ${order.address || 'غير محدد'}\n\n` +
                `📦 *الأصناف:*\n${itemsText}\n\n` +
                `💰 الإجمالي: ${formatMoney(total)}\n` +
                `💳 طريقة الدفع: ${order.paymentMethod}\n` +
                `🧾 فاتورة ضريبية: ${order.taxInvoice ? 'نعم' : 'لا'}\n\n` +
                `*📋 يرجى اختيار حالة الشحنة:*\n` +
                `1️⃣ تم التسليم ✅\n` +
                `2️⃣ لم يتم التسليم ❌\n` +
                `3️⃣ يوجد مشكلة ⚠️\n\n` +
                `✍️ الرجاء الرد برقم الخيار المناسب.\n` +
                `شكراً لتعاونك مع *رصرص للتوكيلات التجارية* 🌟`;
        }

        async function handleWhatsApp(orderId) {
            const order = state.data.orders.find(o => o.id === orderId);
            if (!order) { showToast('الأمر غير موجود'); return; }
            if (!order.driverPhone) { showToast('لا يوجد رقم تليفون للسائق'); return; }
            
            const message = buildWhatsAppMessage(order);
            let phone = order.driverPhone.replace(/[^0-9]/g, '');
            if (phone.startsWith('0')) phone = '2' + phone;
            if (!phone.startsWith('2')) phone = '2' + phone;
            
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
            
            try {
                await API.sendWhatsApp(orderId, phone, message);
            } catch (error) {
                // Silent fail for logging
            }
        }

        // ============ Load Data ============
        async function loadData() {
            try {
                const data = await API.getData();
                state.data = data;
                render();
            } catch (error) {
                showToast('خطأ في تحميل البيانات');
            }
        }

        // ============ Events ============
        function bindEvents() {
            // Logout
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.onclick = () => {
                    state.user = null;
                    state.data = null;
                    render();
                };
            }
            
            // Tabs
            document.querySelectorAll('.tab[data-tab]').forEach(el => {
                el.onclick = () => {
                    state.view = el.dataset.tab;
                    render();
                };
            });
            
            // Enter key for item inputs
            document.querySelectorAll('.item-name, .item-qty, .item-price').forEach(el => {
                el.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        addItemRow();
                    }
                };
            });
        }

        // ============ Init ============
        render();
        
        // Make functions global for inline onclick
        window.setOrderType = setOrderType;
        window.addItemRow = addItemRow;
        window.submitOrder = submitOrder;
        window.handleDriverStatus = handleDriverStatus;
        window.handleWhatsApp = handleWhatsApp;
    </script>
</body>
</html>
