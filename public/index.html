<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RASRAS Material Raw - نظام إدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#f0f2f5;color:#1c2530}
        :root{--primary:#1a2a3a;--gold:#c08a2e;--gold-light:#faf1de;--success:#2b7a6c;--danger:#b23b3b;--card:#fff;--border:#dde2e8}
        .app{max-width:820px;margin:0 auto;padding:16px}
        .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:#fff;padding:16px 20px;border-radius:16px;border:1px solid var(--border);margin-bottom:16px}
        .brand{display:flex;align-items:center;gap:14px}
        .brand-icon{background:var(--primary);color:#fff;padding:10px 16px;border-radius:12px;font-size:20px;font-weight:900}
        .brand h1{font-size:17px;font-weight:800}
        .brand p{font-size:11px;color:#5b6b81}
        .user-info{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;flex-wrap:wrap}
        .user-info .role-badge{background:var(--gold);color:#fff;padding:4px 14px;border-radius:20px;font-size:11px}
        .user-info button{background:var(--danger);color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:700}
        .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
        .tab{padding:8px 16px;border-radius:10px;border:none;background:none;font-weight:700;cursor:pointer;font-size:13px;color:#5b6b81}
        .tab.active{background:var(--primary);color:#fff}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
        .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
        .stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
        .stat b{display:block;font-size:22px;font-weight:800}
        .stat span{font-size:11px;color:#5b6b81}
        .stat .icon{font-size:24px;display:block}
        label{display:block;font-size:12.5px;font-weight:700;color:#3d4a5c;margin:12px 0 5px}
        input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:14px;background:#fbfbfc}
        input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
        .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .btn{width:100%;padding:13px;border-radius:11px;border:none;background:var(--primary);color:#fff;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:16px;transition:all 0.2s}
        .btn:hover{background:#2c3e50}
        .btn-gold{background:var(--gold)}
        .btn-gold:hover{background:#a77520}
        .btn-success{background:var(--success)}
        .btn-success:hover{background:#1e5f52}
        .order-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
        .order-item:hover{border-color:var(--gold)}
        .order-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
        .order-name{font-weight:700}
        .order-meta{font-size:12px;color:#5b6b81}
        .pill{font-size:11px;font-weight:700;padding:2px 12px;border-radius:20px;background:#faf1de;color:#c08a2e}
        .pill.delivered{background:#e4f2ee;color:#2b7a6c}
        .pill.closed{background:#e5e7eb;color:#4b5563}
        .pill.debt{background:#fce4ec;color:#c62828}
        .empty{text-align:center;padding:40px 16px;color:#5b6b81}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:12px 24px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,0.2);z-index:100;opacity:0;transition:all 0.3s;pointer-events:none}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
        .hidden{display:none!important}
        .login-container{max-width:420px;margin:60px auto;padding:35px;background:#fff;border-radius:20px;border:1px solid var(--border)}
        .login-container .login-logo{text-align:center;margin-bottom:24px}
        .login-container .login-logo .big-logo{display:inline-block;background:var(--primary);color:#fff;padding:12px 24px;border-radius:14px;font-size:28px;font-weight:900}
        .login-container .login-logo h2{margin-top:12px;font-size:20px;font-weight:800}
        .login-container .login-logo p{color:#5b6b81;font-size:13px}
        .login-container .sub{text-align:center;color:#5b6b81;font-size:13px;margin-top:12px}
        .login-container .sub a{color:var(--gold);font-weight:700;text-decoration:none}
        .role-selector{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
        .role-selector button{flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:10px;background:#fff;font-family:inherit;font-size:12px;font-weight:700;color:#5b6b81;cursor:pointer;min-width:80px}
        .role-selector button.active{border-color:var(--gold);background:var(--gold-light);color:var(--gold)}
        .user-list-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
        .user-list-item:last-child{border-bottom:none}
        .user-list-item .role-tag{font-size:11px;padding:2px 10px;border-radius:20px;background:var(--gold-light);color:var(--gold)}
        .footer-credit{text-align:center;padding:20px 0 10px;font-size:11px;color:#5b6b81;border-top:1px solid var(--border);margin-top:20px}
        .footer-credit strong{color:var(--gold)}
        @media(max-width:600px){.row2{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <!-- ===== LOGIN ===== -->
    <div id="loginContainer" class="login-container">
        <div class="login-logo">
            <div class="big-logo">RAS</div>
            <h2>رصرص للتوكيلات التجارية</h2>
            <p>RASRAS Material Raw</p>
        </div>
        <div id="loginForm">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="mohamed@rasras.com" value="mohamed@rasras.com">
            <label>كلمة المرور</label>
            <input type="password" id="loginPassword" placeholder="********" value="12345678">
            <button class="btn btn-gold" id="loginBtn">دخول</button>
            <div class="sub">ليس لديك حساب؟ <a href="#" id="showRegisterBtn">سجل الآن</a></div>
        </div>
        <div id="registerForm" class="hidden">
            <label>البريد الإلكتروني</label>
            <input type="email" id="regEmail" placeholder="example@email.com">
            <label>كلمة المرور</label>
            <input type="password" id="regPassword" placeholder="********">
            <label>الدور</label>
            <select id="regRole">
                <option value="manager">🚚 مدير النقل</option>
                <option value="sales">📋 مندوب مبيعات</option>
                <option value="warehouse">🏚️ مخازن</option>
                <option value="viewer">👀 مشاهد</option>
            </select>
            <button class="btn btn-gold" id="registerBtn">إنشاء حساب</button>
            <div class="sub">لديك حساب؟ <a href="#" id="showLoginBtn">سجل دخول</a></div>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="appContainer" class="hidden">
        <div class="app">
            <div class="header">
                <div class="brand">
                    <div class="brand-icon">RAS</div>
                    <div><h1>رصرص للتوكيلات التجارية</h1><p>RASRAS Material Raw · نظام الطلبات</p></div>
                </div>
                <div class="user-info">
                    <span class="role-badge" id="roleBadge">🚚 مدير نقل</span>
                    <span id="userEmailDisplay">user@email.com</span>
                    <button id="logoutBtn">تسجيل خروج</button>
                </div>
            </div>

            <div class="role-selector" id="roleSelector">
                <button class="active" data-role="manager">🚚 مدير النقل</button>
                <button data-role="sales">📋 مندوب مبيعات</button>
                <button data-role="warehouse">🏚️ مخازن</button>
                <button data-role="viewer">👀 مشاهد</button>
            </div>

            <div class="tabs" id="tabsContainer">
                <button class="tab active" data-tab="dashboard">📊 الرئيسية</button>
                <button class="tab" data-tab="new">➕ طلب جديد</button>
                <button class="tab" data-tab="orders">📋 الطلبات</button>
                <button class="tab" data-tab="reports">📈 التقارير</button>
                <button class="tab" data-tab="users" id="usersTab">👥 المستخدمين</button>
            </div>

            <div id="viewDashboard" class="view"></div>
            <div id="viewNew" class="view hidden"></div>
            <div id="viewOrders" class="view hidden"></div>
            <div id="viewReports" class="view hidden"></div>
            <div id="viewUsers" class="view hidden"></div>

            <div class="footer-credit">© 2026 <strong>RASRAS Material Raw</strong> - رصرص للتوكيلات التجارية</div>
        </div>
    </div>

    <script type="module">
        import { Client, Account, Databases, ID } from "https://cdn.jsdelivr.net/npm/appwrite@latest";

        const PROJECT_ID = '6a98cf310022ce38f1c4';
        const DATABASE_ID = 'orders_db';
        const COLLECTION_ID = 'orders_collection';
        const USERS_COLLECTION = 'users_collection';

        const client = new Client().setEndpoint('https://fra.cloud.appwrite.io/v1').setProject(PROJECT_ID);
        const account = new Account(client);
        const databases = new Databases(client);

        window.account = account;
        window.databases = databases;
        window.client = client;
        window.ID = ID;

        const state = {
            user: null,
            orders: [],
            users: [],
            currentTab: 'dashboard',
            userRole: 'manager',
            draft: {
                customerName: '',
                phone: '',
                address: '',
                items: [{ name: '', qty: 1, price: 0 }],
                paymentMethod: 'نقدي',
                debtPeriod: 0,
                dueDate: null,
                willCollect: true,
                collectAmount: 0,
                notes: '',
                driverPhone: ''
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function fmtMoney(n) { return Number(n || 0).toLocaleString('ar-EG') + ' ج.م'; }
        function fmtDate(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }); }
        function fmtDateTime(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
        function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c])); }
        function generateOrderId() { return 'RAS-' + String(Date.now()).slice(-8) + '-' + String(Math.floor(Math.random() * 9000) + 1000); }
        function calculateDueDate(debtPeriod) { if (!debtPeriod || debtPeriod <= 0) return null; const d = new Date(); d.setDate(d.getDate() + Number(debtPeriod)); return d.toISOString(); }
        function isOverdue(dueDate) { if (!dueDate) return false; return new Date(dueDate) < new Date(); }

        function buildWhatsAppMessage(order) {
            const itemsText = order.items.map(i => `• ${i.name} × ${i.qty} = ${fmtMoney(i.qty * i.price)}`).join('\n');
            const collectText = order.willCollect ? `✅ سيستلم ${fmtMoney(order.collectAmount)} (${order.paymentMethod})` : '❌ لا يستلم مبلغ';
            const debtText = order.paymentMethod === 'آجل' ? `\n📅 آجل: استحقاق ${fmtDate(order.dueDate)}` : '';
            const appUrl = window.location.origin + window.location.pathname;
            return `🚚 *إشعار شحنة جديدة - RASRAS Material Raw* 🚚\n\n📋 رقم الطلب: ${order.orderId}\n👤 العميل: ${order.customerName}\n📞 التليفون: ${order.phone}\n📍 العنوان: ${order.address}\n\n📦 *الأصناف:*\n${itemsText}\n\n💰 ${collectText}${debtText}\n\n📝 ملاحظات: ${order.notes || 'لا توجد'}\n\n⏰ تاريخ الإرسال: ${fmtDateTime(order.createdAt)}\n\n---\n*🔘 إجراءات التسليم:*\n1️⃣ ✅ تم التسليم كاملاً\n2️⃣ ⚠️ تم التسليم جزئياً (اكتب الكمية بالكيلو)\n3️⃣ ❌ لم يتم التسليم\n\n📱 للتحديث: اضغط على الرابط التالي\n${appUrl}?order=${order.$id}\n\nشكراً لتعاونك - رصرص للتوكيلات التجارية`;
        }

        function sendWhatsApp(driverPhone, order) {
            if (!driverPhone || driverPhone.length < 10) { showToast('❌ أدخل رقم هاتف صحيح'); return; }
            let phone = driverPhone.replace(/[^0-9]/g, '');
            if (phone.startsWith('0')) phone = '2' + phone;
            if (!phone.startsWith('2')) phone = '2' + phone;
            const msg = buildWhatsAppMessage(order);
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
            showToast('✅ تم فتح واتساب مع السائق');
        }

        // ========== LOAD DATA ==========
        async function loadOrders() {
            try {
                const response = await databases.listDocuments(DATABASE_ID, COLLECTION_ID);
                state.orders = response.documents.map(d => ({ ...d, $id: d.$id }));
                renderAll();
            } catch (e) {
                state.orders = [];
                renderAll();
            }
        }

        async function loadUsers() {
            try {
                const response = await databases.listDocuments(DATABASE_ID, USERS_COLLECTION);
                state.users = response.documents.map(d => ({ ...d, $id: d.$id }));
            } catch (e) {
                state.users = [];
            }
        }

        async function createOrder(orderData) {
            try {
                const doc = await databases.createDocument(DATABASE_ID, COLLECTION_ID, ID.unique(), orderData);
                state.orders.unshift(doc);
                renderAll();
                showToast('✅ تم إنشاء الطلب');
                return doc;
            } catch (e) {
                showToast('❌ ' + e.message);
                return null;
            }
        }

        async function updateOrder(orderId, data) {
            try {
                const doc = await databases.updateDocument(DATABASE_ID, COLLECTION_ID, orderId, data);
                const idx = state.orders.findIndex(o => o.$id === orderId);
                if (idx !== -1) state.orders[idx] = doc;
                renderAll();
                showToast('✅ تم التحديث');
                return doc;
            } catch (e) {
                showToast('❌ ' + e.message);
                return null;
            }
        }

        async function createUserInDB(email, role) {
            try {
                const doc = await databases.createDocument(DATABASE_ID, USERS_COLLECTION, ID.unique(), {
                    email: email,
                    role: role,
                    createdAt: new Date().toISOString()
                });
                state.users.push(doc);
                renderUsers();
                showToast('✅ تم إضافة المستخدم');
                return doc;
            } catch (e) {
                showToast('❌ ' + e.message);
                return null;
            }
        }

        // ========== AUTH ==========
        async function checkUser() {
            try {
                const user = await account.get();
                state.user = user;
                document.getElementById('loginContainer').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userEmailDisplay').textContent = user.email;

                await loadOrders();
                await loadUsers();

                // إظهار تبويب المستخدمين للمدير فقط
                const usersTab = document.getElementById('usersTab');
                if (state.userRole === 'manager') {
                    usersTab.style.display = 'block';
                } else {
                    usersTab.style.display = 'none';
                }
                renderAll();
            } catch (e) {
                state.user = null;
                document.getElementById('loginContainer').classList.remove('hidden');
                document.getElementById('appContainer').classList.add('hidden');
            }
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await account.createEmailPasswordSession(email, pass);
                showToast('✅ مرحباً!');
                checkUser();
            } catch (e) {
                showToast('❌ ' + e.message);
            }
        });

        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            if (!email || !pass) { showToast('❌ أدخل البريد وكلمة المرور'); return; }
            try {
                await account.create(ID.unique(), email, pass);
                await createUserInDB(email, role);
                showToast('✅ تم إنشاء الحساب، سجل دخول الآن');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('regEmail').value = '';
                document.getElementById('regPassword').value = '';
            } catch (e) {
                showToast('❌ ' + e.message);
            }
        });

        document.getElementById('showRegisterBtn').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
        });

        document.getElementById('showLoginBtn').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await account.deleteSession('current');
                state.user = null;
                showToast('👋 تم تسجيل الخروج');
                checkUser();
            } catch (e) {
                showToast('❌ ' + e.message);
            }
        });

        // ========== ROLES ==========
        document.querySelectorAll('#roleSelector button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#roleSelector button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.userRole = btn.dataset.role;
                const roleNames = { manager: '🚚 مدير النقل', sales: '📋 مندوب مبيعات', warehouse: '🏚️ مخازن', viewer: '👀 مشاهد' };
                document.getElementById('roleBadge').textContent = roleNames[state.userRole];
                renderAll();
            });
        });

        // ========== TABS ==========
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                state.currentTab = tab.dataset.tab;
                renderAll();
            });
        });

        // ========== RENDER FUNCTIONS ==========
        function renderAll() {
            renderDashboard();
            renderOrders();
            renderReports();
            renderNewOrder();
            renderUsers();
            updateTabs();
        }

        function updateTabs() {
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === state.currentTab);
            });
            document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
            const map = { 'dashboard': 'viewDashboard', 'new': 'viewNew', 'orders': 'viewOrders', 'reports': 'viewReports', 'users': 'viewUsers' };
            const target = document.getElementById(map[state.currentTab]);
            if (target) target.classList.remove('hidden');
        }

        function renderDashboard() {
            const el = document.getElementById('viewDashboard');
            const total = state.orders.length;
            const closed = state.orders.filter(o => o.isClosed === true).length;
            const pending = state.orders.filter(o => o.isClosed !== true).length;
            const delivered = state.orders.filter(o => o.status === 'delivered').length;
            const totalRevenue = state.orders.reduce((sum, o) => sum + (Number(o.collectAmount) || 0), 0);
            const totalDebt = state.orders.filter(o => o.paymentMethod === 'آجل' && o.isClosed !== true).reduce((sum, o) => sum + (Number(o.collectAmount) || 0), 0);
            const overdueCount = state.orders.filter(o => o.paymentMethod === 'آجل' && isOverdue(o.dueDate) && o.isClosed !== true).length;
            const recent = state.orders.slice(0, 5);

            el.innerHTML = `
            <div class="stat-row">
              <div class="stat"><span class="icon">📦</span><b>${total}</b><span>إجمالي الطلبات</span></div>
              <div class="stat"><span class="icon">⏳</span><b>${pending}</b><span>قيد التنفيذ</span></div>
              <div class="stat"><span class="icon">✅</span><b>${delivered}</b><span>تم التسليم</span></div>
              <div class="stat"><span class="icon">🔒</span><b>${closed}</b><span>مغلقة</span></div>
            </div>
            <div class="stat-row">
              <div class="stat"><span class="icon">💰</span><b>${fmtMoney(totalRevenue)}</b><span>إجمالي الإيرادات</span></div>
              <div class="stat" style="border-color:${overdueCount > 0 ? 'var(--danger)' : 'var(--border)'}">
                <span class="icon">📅</span>
                <b style="color:${overdueCount > 0 ? 'var(--danger)' : 'inherit'}">${fmtMoney(totalDebt)}</b>
                <span>ديون آجل ${overdueCount > 0 ? '⚠️ ' + overdueCount + ' متأخرة' : ''}</span>
              </div>
            </div>
            <h2 style="font-size:14px;font-weight:700;margin:16px 0 8px;">📋 آخر الطلبات</h2>
            ${recent.length === 0 ? '<div class="empty">لا توجد طلبات</div>' : recent.map(orderCardHTML).join('')}
          `;
            // ربط الضغط على الطلبات
            document.querySelectorAll('.order-item').forEach(el => {
                el.addEventListener('click', () => {
                    showToast('📋 تفاصيل الطلب: ' + el.dataset.orderId);
                });
            });
        }

        function orderCardHTML(o) {
            const statusMap = { 'pending': 'قيد التنفيذ', 'delivered': 'تم التسليم', 'closed': 'مغلقة' };
            const pillClass = o.isClosed ? 'closed' : o.status === 'delivered' ? 'delivered' : 'pending';
            return `
            <div class="order-item" data-order-id="${o.$id}">
              <div class="order-top">
                <div>
                  <div class="order-name">${escapeHtml(o.customerName)}</div>
                  <div class="order-meta">${fmtDate(o.createdAt)} · ${fmtMoney(o.collectAmount)}</div>
                </div>
                <span class="pill ${pillClass}">${statusMap[o.status] || 'قيد التنفيذ'}</span>
              </div>
            </div>
          `;
        }

        function renderOrders() {
            const el = document.getElementById('viewOrders');
            const list = state.orders;
            el.innerHTML = `
            <h2 style="font-size:14px;font-weight:700;margin:14px 0 8px;">📋 جميع الطلبات (${list.length})</h2>
            ${list.length === 0 ? '<div class="empty">لا توجد طلبات</div>' : list.map(orderCardHTML).join('')}
          `;
        }

        function renderReports() {
            const el = document.getElementById('viewReports');
            const total = state.orders.length;
            const delivered = state.orders.filter(o => o.status === 'delivered').length;
            const pending = state.orders.filter(o => o.isClosed !== true).length;
            const closed = state.orders.filter(o => o.isClosed === true).length;
            const totalRevenue = state.orders.reduce((sum, o) => sum + (Number(o.collectAmount) || 0), 0);
            const totalDebt = state.orders.filter(o => o.paymentMethod === 'آجل' && o.isClosed !== true).reduce((sum, o) => sum + (Number(o.collectAmount) || 0), 0);

            el.innerHTML = `
            <h2 style="font-size:14px;font-weight:700;margin:0 0 12px;">📈 التقارير والإحصائيات</h2>
            <div class="stat-row">
              <div class="stat"><span class="icon">📦</span><b>${total}</b><span>إجمالي الطلبات</span></div>
              <div class="stat"><span class="icon">✅</span><b>${delivered}</b><span>تم التسليم</span></div>
              <div class="stat"><span class="icon">⏳</span><b>${pending}</b><span>قيد التنفيذ</span></div>
              <div class="stat"><span class="icon">🔒</span><b>${closed}</b><span>مغلقة</span></div>
            </div>
            <div class="stat-row">
              <div class="stat"><span class="icon">💰</span><b>${fmtMoney(totalRevenue)}</b><span>إجمالي الإيرادات</span></div>
              <div class="stat"><span class="icon">📅</span><b>${fmtMoney(totalDebt)}</b><span>إجمالي الديون (آجل)</span></div>
            </div>
          `;
        }

        function renderUsers() {
            const el = document.getElementById('viewUsers');
            if (state.userRole !== 'manager') {
                el.innerHTML = '<div class="empty">⛔ هذه الصفحة مخصصة للمدير فقط</div>';
                return;
            }
            const list = state.users;
            el.innerHTML = `
            <div class="card" style="border:2px solid var(--gold);">
              <h3 style="color:var(--gold);margin-bottom:12px;">👥 إدارة المستخدمين</h3>
              <div class="row2">
                <input type="email" id="newUserEmail" placeholder="البريد الإلكتروني">
                <input type="password" id="newUserPassword" placeholder="كلمة المرور">
              </div>
              <div class="row2" style="margin-top:8px;">
                <select id="newUserRole">
                  <option value="manager">🚚 مدير النقل</option>
                  <option value="sales">📋 مندوب مبيعات</option>
                  <option value="warehouse">🏚️ مخازن</option>
                  <option value="viewer">👀 مشاهد</option>
                </select>
                <button class="btn btn-gold" id="addUserBtn" style="margin:0;">➕ إضافة مستخدم</button>
              </div>
            </div>
            <div class="card">
              <h3 style="font-size:14px;">📋 قائمة المستخدمين (${list.length})</h3>
              ${list.length === 0 ? '<div class="empty">لا يوجد مستخدمون</div>' :
                list.map(u => `
                  <div class="user-list-item">
                    <span>${escapeHtml(u.email)}</span>
                    <span class="role-tag">${u.role || 'مشاهد'}</span>
                  </div>
                `).join('')
              }
            </div>
          `;
            document.getElementById('addUserBtn')?.addEventListener('click', async () => {
                const email = document.getElementById('newUserEmail').value;
                const pass = document.getElementById('newUserPassword').value;
                const role = document.getElementById('newUserRole').value;
                if (!email || !pass) { showToast('❌ أدخل البريد وكلمة المرور'); return; }
                try {
                    await account.create(ID.unique(), email, pass);
                    await createUserInDB(email, role);
                    document.getElementById('newUserEmail').value = '';
                    document.getElementById('newUserPassword').value = '';
                    showToast('✅ تم إضافة المستخدم');
                } catch (e) {
                    showToast('❌ ' + e.message);
                }
            });
        }

        function renderNewOrder() {
            const el = document.getElementById('viewNew');
            const d = state.draft;
            el.innerHTML = `
            <div class="card">
              <h2 style="font-size:16px;margin-bottom:12px;">➕ طلب شحن جديد</h2>
              <label>👤 اسم العميل</label>
              <input type="text" id="f_customer" value="${escapeHtml(d.customerName)}" placeholder="اسم العميل">
              <div class="row2">
                <div><label>📞 التليفون</label><input type="tel" id="f_phone" value="${escapeHtml(d.phone)}" placeholder="01xxxxxxxxx"></div>
                <div><label>📍 العنوان</label><input type="text" id="f_address" value="${escapeHtml(d.address)}" placeholder="العنوان"></div>
              </div>
              <label>📦 الأصناف</label>
              <div id="itemsWrap">
                ${d.items.map((it, idx) => `
                  <div class="row2" style="gap:6px;margin-bottom:6px;" data-idx="${idx}">
                    <input type="text" placeholder="اسم الصنف" data-field="name" value="${escapeHtml(it.name)}">
                    <input type="number" placeholder="كمية" data-field="qty" value="${it.qty}" min="1">
                    <input type="number" placeholder="سعر" data-field="price" value="${it.price}" min="0">
                    <button class="btn" style="width:auto;padding:8px 12px;margin:0;background:var(--danger);" data-rm="${idx}">✕</button>
                  </div>
                `).join('')}
              </div>
              <button class="btn" style="margin:6px 0 0;background:var(--border);color:var(--primary);" id="addItemBtn">+ إضافة صنف</button>

              <label>💰 طريقة الدفع</label>
              <select id="f_payment">
                <option value="نقدي" ${d.paymentMethod === 'نقدي' ? 'selected' : ''}>نقدي</option>
                <option value="آجل" ${d.paymentMethod === 'آجل' ? 'selected' : ''}>آجل</option>
              </select>

              <div id="debtPeriodWrap" class="${d.paymentMethod !== 'آجل' ? 'hidden' : ''}" style="margin-top:8px;">
                <label>📅 مدة الأجل (عدد الأيام)</label>
                <input type="number" id="f_debtPeriod" value="${d.debtPeriod || 0}" min="0" placeholder="مثلاً: 30">
                <p style="font-size:11px;color:#5b6b81;margin-top:4px;">📌 تاريخ الاستحقاق: <strong id="dueDateDisplay">${d.dueDate ? fmtDate(d.dueDate) : '—'}</strong></p>
              </div>

              <label>💰 هل سيستلم السائق مبلغ؟</label>
              <select id="f_collect">
                <option value="true" ${d.willCollect ? 'selected' : ''}>نعم</option>
                <option value="false" ${!d.willCollect ? 'selected' : ''}>لا</option>
              </select>

              <div id="collectAmountWrap" class="${!d.willCollect ? 'hidden' : ''}">
                <label>المبلغ المستلم</label>
                <input type="number" id="f_collectAmount" value="${d.collectAmount || 0}" min="0" placeholder="0">
              </div>

              <label>📝 ملاحظات</label>
              <textarea id="f_notes" rows="2">${escapeHtml(d.notes)}</textarea>

              <label>📱 رقم السائق (للإرسال عبر واتساب)</label>
              <input type="tel" id="f_driverPhone" value="${escapeHtml(d.driverPhone)}" placeholder="مثال: 201012345678">

              <div class="row2" style="margin-top:10px;">
                <button class="btn" id="submitOrderBtn">🚀 إنشاء الطلب</button>
                <button class="btn btn-success" id="submitAndWhatsAppBtn">📱 إنشاء + إرسال واتساب</button>
              </div>
            </div>
          `;
            bindNewOrderEvents();
        }

        function bindNewOrderEvents() {
            const d = state.draft;
            document.getElementById('f_customer')?.addEventListener('input', e => d.customerName = e.target.value);
            document.getElementById('f_phone')?.addEventListener('input', e => d.phone = e.target.value);
            document.getElementById('f_address')?.addEventListener('input', e => d.address = e.target.value);
            document.getElementById('f_notes')?.addEventListener('input', e => d.notes = e.target.value);
            document.getElementById('f_driverPhone')?.addEventListener('input', e => d.driverPhone = e.target.value);
            document.getElementById('f_payment')?.addEventListener('change', e => {
                d.paymentMethod = e.target.value;
                document.getElementById('debtPeriodWrap').classList.toggle('hidden', d.paymentMethod !== 'آجل');
                if (d.paymentMethod === 'آجل') {
                    d.dueDate = calculateDueDate(d.debtPeriod);
                    document.getElementById('dueDateDisplay').textContent = fmtDate(d.dueDate);
                } else {
                    d.dueDate = null;
                    document.getElementById('dueDateDisplay').textContent = '—';
                }
            });
            document.getElementById('f_debtPeriod')?.addEventListener('input', e => {
                d.debtPeriod = Number(e.target.value) || 0;
                d.dueDate = calculateDueDate(d.debtPeriod);
                document.getElementById('dueDateDisplay').textContent = fmtDate(d.dueDate);
            });
            document.getElementById('f_collect')?.addEventListener('change', e => {
                d.willCollect = e.target.value === 'true';
                document.getElementById('collectAmountWrap').classList.toggle('hidden', !d.willCollect);
            });
            document.getElementById('f_collectAmount')?.addEventListener('input', e => d.collectAmount = Number(e.target.value) || 0);

            document.querySelectorAll('#itemsWrap .row2').forEach(row => {
                const idx = Number(row.dataset.idx);
                row.querySelectorAll('input[data-field]').forEach(inp => {
                    inp.addEventListener('input', () => {
                        const field = inp.dataset.field;
                        d.items[idx][field] = field === 'name' ? inp.value : Number(inp.value) || 0;
                    });
                });
                row.querySelector('[data-rm]')?.addEventListener('click', () => {
                    if (d.items.length > 1) {
                        d.items.splice(idx, 1);
                        renderNewOrder();
                    }
                });
            });
            document.getElementById('addItemBtn')?.addEventListener('click', () => {
                d.items.push({ name: '', qty: 1, price: 0 });
                renderNewOrder();
            });
            document.getElementById('submitOrderBtn')?.addEventListener('click', () => submitOrder(false));
            document.getElementById('submitAndWhatsAppBtn')?.addEventListener('click', () => submitOrder(true));
        }

        async function submitOrder(sendWhatsAppNow) {
            const d = state.draft;
            if (!d.customerName.trim()) { showToast('❌ أدخل اسم العميل'); return; }
            if (!d.phone.trim()) { showToast('❌ أدخل رقم التليفون'); return; }
            const cleanItems = d.items.filter(i => i.name.trim() && i.qty > 0);
            if (cleanItems.length === 0) { showToast('❌ أضف صنف'); return; }
            d.items = cleanItems;

            const orderData = {
                orderId: generateOrderId(),
                customerName: d.customerName.trim(),
                phone: d.phone.trim(),
                address: d.address.trim(),
                items: d.items,
                paymentMethod: d.paymentMethod,
                debtPeriod: d.paymentMethod === 'آجل' ? d.debtPeriod : 0,
                dueDate: d.paymentMethod === 'آجل' ? d.dueDate : null,
                willCollect: d.willCollect,
                collectAmount: d.collectAmount || 0,
                notes: d.notes || '',
                status: 'pending',
                isClosed: false,
                createdAt: new Date().toISOString(),
                createdBy: state.user?.email || 'unknown',
                driverPhone: d.driverPhone || '',
                history: [{ note: '📝 تم إنشاء الطلب', by: state.user?.email || 'نظام', at: new Date().toISOString() }]
            };

            const doc = await createOrder(orderData);
            if (doc) {
                state.draft = {
                    customerName: '',
                    phone: '',
                    address: '',
                    items: [{ name: '', qty: 1, price: 0 }],
                    paymentMethod: 'نقدي',
                    debtPeriod: 0,
                    dueDate: null,
                    willCollect: true,
                    collectAmount: 0,
                    notes: '',
                    driverPhone: ''
                };
                if (sendWhatsAppNow && d.driverPhone) {
                    sendWhatsApp(d.driverPhone, doc);
                } else if (sendWhatsAppNow && !d.driverPhone) {
                    showToast('⚠️ لم تدخل رقم السائق');
                }
                state.currentTab = 'orders';
                renderAll();
            }
        }

        // ========== START ==========
        checkUser();
    </script>
</body>
  </html>
