<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رصرص للتوكيلات التجارية - نظام الإدارة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: #f0f2f5;
            direction: rtl;
        }
        
        :root {
            --primary: #1a2a3a;
            --gold: #c9a84c;
            --gold-dark: #a8892e;
            --gold-light: #f5e6b8;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 12px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Login */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), #2c3e50);
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        
        .login-card .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-card .logo h1 {
            font-size: 24px;
            color: var(--primary);
            font-weight: 900;
        }
        
        .login-card .logo p {
            color: #7f8c8d;
            font-size: 13px;
        }
        
        .login-card .logo .brand {
            width: 72px;
            height: 72px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 32px;
            font-weight: 900;
            color: white;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf0;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: var(--radius);
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 168, 76, 0.3);
        }
        
        /* Header */
        .header {
            background: white;
            border-radius: var(--radius);
            padding: 16px 24px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-brand .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 20px;
        }
        
        .header-brand h2 {
            font-size: 16px;
            font-weight: 800;
        }
        
        .header-brand span {
            font-size: 11px;
            color: #7f8c8d;
        }
        
        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #f8f9fa;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .user-info .avatar {
            width: 30px;
            height: 30px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 12px;
        }
        
        .btn-logout {
            padding: 8px 16px;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            background: none;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: #7f8c8d;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        
        .stat-card .number {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
        }
        
        .stat-card .label {
            font-size: 13px;
            color: #7f8c8d;
            font-weight: 600;
            margin-top: 4px;
        }
        
        .stat-card.gold .number { color: var(--gold-dark); }
        .stat-card.green .number { color: var(--success); }
        .stat-card.red .number { color: var(--danger); }
        .stat-card.blue .number { color: #3498db; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }
        
        .tab {
            padding: 10px 20px;
            border: none;
            background: white;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            color: #7f8c8d;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .tab:hover {
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: var(--primary);
            color: white;
        }
        
        .tab .badge {
            background: var(--danger);
            color: white;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 10px;
            margin-right: 6px;
        }
        
        /* Order Cards */
        .order-card {
            background: white;
            border-radius: var(--radius);
            padding: 18px 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border-right: 4px solid var(--gold);
            transition: all 0.3s;
        }
        
        .order-card:hover {
            transform: translateX(-4px);
        }
        
        .order-card .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            padding: 0;
            box-shadow: none;
            background: none;
        }
        
        .order-card .order-id {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
        }
        
        .order-card .order-name {
            font-size: 16px;
            font-weight: 700;
        }
        
        .order-card .order-meta {
            font-size: 12px;
            color: #7f8c8d;
        }
        
        .status-badge {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }
        
        .status-sales_created { background: #e8ecf0; color: #5a6a7a; }
        .status-logistics_review { background: #fef9e7; color: #b7950b; }
        .status-accounts_approval { background: #fef9e7; color: #b7950b; }
        .status-warehouse_release { background: #eafaf1; color: #1a7a5a; }
        .status-with_driver { background: #d5f5e3; color: #1a7a5a; }
        .status-delivered { background: var(--primary); color: white; }
        
        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-whatsapp:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        
        .btn-driver {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-driver-delivered {
            background: var(--success);
            color: white;
        }
        
        .btn-driver-not-delivered {
            background: var(--danger);
            color: white;
        }
        
        .btn-driver-problem {
            background: var(--warning);
            color: white;
        }
        
        .btn-driver:hover {
            transform: scale(1.02);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-8px);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal-overlay.show {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal .modal-header h3 {
            font-size: 18px;
        }
        
        .modal .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f8f9fa;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .modal .modal-close:hover {
            background: var(--danger);
            color: white;
        }
        
        .modal .form-group {
            margin-bottom: 16px;
        }
        
        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
        }
        
        .modal .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .header { flex-direction: column; align-items: stretch; }
            .header-user { justify-content: space-between; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .login-card { padding: 32px 24px; }
            .order-card .header { flex-direction: column; }
        }
        
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .stat-card { padding: 14px; }
            .stat-card .number { font-size: 22px; }
            .tabs { gap: 4px; }
            .tab { padding: 8px 14px; font-size: 12px; }
            .order-actions { flex-direction: column; }
            .btn-whatsapp, .btn-driver { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="toast" id="toast"></div>

    <script>
        // ============ API Client ============
        const API = {
            async request(endpoint, options = {}) {
                const response = await fetch(`/api${endpoint}`, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...(options.headers || {})
                    }
                });
                return response.json();
            },
            
            async login(username, password) {
                return this.request('/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
            },
            
            async getData() {
                return this.request('/data');
            },
            
            async getStats() {
                return this.request('/stats');
            },
            
            async createOrder(order) {
                return this.request('/orders', {
                    method: 'POST',
                    body: JSON.stringify(order)
                });
            },
            
            async updateOrder(id, data) {
                return this.request(`/orders/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(data)
                });
            },
            
            async updateDriverStatus(id, status, note) {
                return this.request(`/orders/${id}/driver-status`, {
                    method: 'POST',
                    body: JSON.stringify({ status, note })
                });
            },
            
            async sendWhatsApp(orderId, phone, message) {
                return this.request('/whatsapp/send', {
                    method: 'POST',
                    body: JSON.stringify({ orderId, phone, message })
                });
            }
        };

        // ============ State ============
        let state = {
            user: null,
            data: null,
            view: 'dashboard',
            loading: false
        };

        // ============ Helpers ============
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 3000);
        }

        function formatDate(iso) {
            const d = new Date(iso);
            return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatMoney(n) {
            return Number(n || 0).toLocaleString('ar-EG') + ' ج.م';
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        function getStageLabel(stage) {
            const stages = {
                'sales_created': 'تم الإنشاء',
                'logistics_review': 'مراجعة النقل',
                'accounts_approval': 'اعتماد الحسابات',
                'warehouse_release': 'إذن الصرف',
                'with_driver': 'مع السائق',
                'delivered': 'تم التسليم'
            };
            return stages[stage] || stage;
        }

        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').substring(0, 2);
        }

        // ============ Render Functions ============

        function render() {
            const app = document.getElementById('app');
            
            if (!state.user) {
                app.innerHTML = renderLogin();
                bindLoginEvents();
                return;
            }
            
            if (!state.data) {
                app.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>جارِ تحميل البيانات...</p></div>';
                loadData();
                return;
            }
            
            app.innerHTML = `
                ${renderHeader()}
                <div class="container">
                    ${renderStats()}
                    ${renderTabs()}
                    ${renderView()}
                </div>
            `;
            
            bindEvents();
        }

        // ============ Login ============
        function renderLogin() {
            return `
                <div class="login-page">
                    <div class="login-card">
                        <div class="logo">
                            <div class="brand">R</div>
                            <h1>رصرص للتوكيلات التجارية</h1>
                            <p>Rasras for Commercial Agencies</p>
                        </div>
                        <div class="form-group">
                            <label>اسم المستخدم</label>
                            <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم" value="admin">
                        </div>
                        <div class="form-group">
                            <label>كلمة المرور</label>
                            <input type="password" id="loginPass" placeholder="أدخل كلمة المرور" value="admin123">
                        </div>
                        <button class="btn-primary" id="loginBtn">تسجيل الدخول</button>
                        <div style="text-align:center;margin-top:16px;font-size:11px;color:#7f8c8d;">
                            <p>🔑 admin / admin123 | sales / sales123</p>
                            <p>logistics / log123 | accounts / acc123</p>
                            <p>warehouse / ware123 | driver1 / driver123</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function bindLoginEvents() {
            const loginBtn = document.getElementById('loginBtn');
            const loginUser = document.getElementById('loginUser');
            const loginPass = document.getElementById('loginPass');
            
            const doLogin = async () => {
                const username = loginUser.value.trim();
                const password = loginPass.value.trim();
                if (!username || !password) {
                    showToast('يرجى إدخال اسم المستخدم وكلمة المرور');
                    return;
                }
                
                try {
                    const result = await API.login(username, password);
                    if (result.success) {
                        state.user = result.user;
                        showToast(`مرحباً ${result.user.name}`);
                        render();
                    } else {
                        showToast(result.message || 'بيانات الدخول غير صحيحة');
                    }
                } catch (error) {
                    showToast('حدث خطأ في الاتصال بالخادم');
                }
            };
            
            loginBtn.onclick = doLogin;
            loginPass.onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
            loginUser.onkeydown = (e) => { if (e.key === 'Enter') loginPass.focus(); };
        }

        // ============ Header ============
        function renderHeader() {
            const initials = getInitials(state.user.name);
            const roleLabels = {
                admin: 'مدير النظام',
                sales: 'المبيعات',
                logistics: 'النقل',
                accounts: 'الحسابات',
                warehouse: 'المخازن',
                driver: 'سائق'
            };
            
            return `
                <div class="container">
                    <div class="header">
                        <div class="header-brand">
                            <div class="brand-icon">R</div>
                            <div>
                                <h2>رصرص للتوكيلات التجارية</h2>
                                <span>Rasras for Commercial Agencies</span>
                            </div>
                        </div>
                        <div class="header-user">
                            <div class="user-info">
                                <div class="avatar">${initials}</div>
                                ${state.user.name} · ${roleLabels[state.user.role] || state.user.role}
                            </div>
                            <button class="btn-logout" id="logoutBtn">تسجيل خروج</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============ Stats ============
        function renderStats() {
            const orders = state.data.orders || [];
            const total = orders.length;
            const pending = orders.filter(o => o.stage !== 'delivered').length;
            const delivered = orders.filter(o => o.stage === 'delivered').length;
            const myTasks = getMyTasks().length;
            
            return `
                <div class="stats-grid">
                    <div class="stat-card gold">
                        <div class="number">${total}</div>
                        <div class="label">📦 إجمالي الأوامر</div>
                    </div>
                    <div class="stat-card blue">
                        <div class="number">${pending}</div>
                        <div class="label">⏳ قيد التنفيذ</div>
                    </div>
                    <div class="stat-card green">
                        <div class="number">${delivered}</div>
                        <div class="label">✅ تم التسليم</div>
