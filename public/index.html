<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RASRAS PLASTIC ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{
 --bg:#f1f4f1;
 --card:#fff;
 --text:#182018;
 --muted:#667267;
 --line:#dce5dc;
 --green:#237a41;
 --green2:#e6f4ea;
 --red:#b23b3b;
 --red2:#faeaea;
 --blue:#286c91;
 --blue2:#e8f3f8;
 --orange:#a86c19;
 --orange2:#fff2dc;
}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Cairo,Arial,sans-serif
}
button,input,select,textarea{font-family:inherit}
.app{max-width:900px;margin:auto;padding:15px 15px 70px}
.login{
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.login-card{
 width:100%;max-width:390px;background:white;
 border:1px solid var(--line);border-radius:22px;
 padding:30px;box-shadow:0 15px 50px #00000010;
 text-align:center
}
.logo{
 width:90px;height:90px;border-radius:20px;
 background:var(--green2);margin:auto auto 15px;
 display:flex;align-items:center;justify-content:center;
 color:var(--green);font-size:24px;font-weight:800
}
h1{font-size:21px;margin:0 0 4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:25px}
label{
 display:block;text-align:right;font-size:12px;
 font-weight:700;color:#435044;margin:13px 0 5px
}
input,select,textarea{
 width:100%;padding:11px 12px;
 border:1px solid var(--line);border-radius:10px;
 background:#fafcfb;font-size:14px;outline:none
}
input:focus,select:focus,textarea:focus{
 border-color:var(--green);background:white
}
.btn{
 border:0;border-radius:11px;padding:12px 15px;
 cursor:pointer;font-weight:700;font-size:13px
}
.primary{background:var(--green);color:white}
.danger{background:var(--red);color:white}
.secondary{background:#eef2ee;color:var(--text)}
.full{width:100%}
.error{
 display:none;background:var(--red2);color:var(--red);
 padding:10px;border-radius:9px;margin-top:12px;
 font-size:12px;font-weight:700
}
.error.show{display:block}

.header{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:7px 0 15px
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{
 width:45px;height:45px;border-radius:13px;
 background:var(--green2);display:flex;
 align-items:center;justify-content:center;
 color:var(--green);font-weight:800
}
.brand-title{font-size:15px;font-weight:800}
.brand-sub{font-size:10px;color:var(--muted)}
.user{
 background:white;border:1px solid var(--line);
 border-radius:10px;padding:8px 10px;
 font-size:11px;font-weight:700
}
.role{
 display:block;color:var(--green);font-size:9px;margin-top:2px
}

.tabs{
 display:flex;gap:7px;overflow:auto;
 border-bottom:1px solid var(--line);margin-bottom:15px
}
.tab{
 white-space:nowrap;border:0;background:none;
 padding:9px 7px;color:var(--muted);
 font-size:12px;font-weight:700;cursor:pointer
}
.tab.active{color:var(--green);border-bottom:2px solid var(--green)}

.stats{
 display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
 margin-bottom:12px
}
.stat{
 background:white;border:1px solid var(--line);
 border-radius:13px;padding:14px;text-align:center
}
.stat b{display:block;font-size:21px}
.stat span{font-size:10px;color:var(--muted)}

.card{
 background:white;border:1px solid var(--line);
 border-radius:14px;padding:15px;margin-bottom:12px
}
.title{
 display:flex;justify-content:space-between;
 align-items:center;font-size:14px;font-weight:800;
 margin:17px 0 9px
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.order{
 background:white;border:1px solid var(--line);
 border-radius:13px;padding:13px;margin-bottom:8px;
 cursor:pointer
}
.order-head{
 display:flex;justify-content:space-between;
 align-items:flex-start;gap:8px
}
.order-id{font-size:10px;color:var(--muted)}
.order-name{font-size:14px;font-weight:800}
.order-meta{font-size:11px;color:var(--muted);margin-top:3px}
.badge{
 padding:4px 9px;border-radius:20px;
 font-size:9px;font-weight:800;white-space:nowrap
}
.b-green{background:var(--green2);color:var(--green)}
.b-blue{background:var(--blue2);color:var(--blue)}
.b-orange{background:var(--orange2);color:var(--orange)}
.b-gray{background:#edf0ed;color:#657065}
.b-dark{background:#222;color:#fff}

.segment{display:flex;gap:6px}
.segment button{
 flex:1;border:1px solid var(--line);
 background:#fafcfa;border-radius:9px;
 padding:9px;font-size:12px;font-weight:700;cursor:pointer
}
.segment button.active{background:var(--green);color:#fff;border-color:var(--green)}

.item{
 display:grid;grid-template-columns:1fr 75px 95px 30px;
 gap:6px;margin-bottom:7px
}
.item input{padding:8px;font-size:12px}
.remove{
 border:1px solid var(--line);background:white;
 color:var(--red);border-radius:8px;cursor:pointer
}
.total{
 display:flex;justify-content:space-between;
 border-top:1px solid var(--line);
 padding-top:12px;margin-top:12px;font-size:13px
}
.total b{font-size:17px}

.steps{display:flex;margin:20px 0}
.step{flex:1;text-align:center;position:relative}
.step:after{
 content:"";height:2px;background:#e3e8e3;
 position:absolute;top:10px;left:0;right:50%;z-index:0
}
.step:first-child:after{display:none}
.dot{
 width:21px;height:21px;border-radius:50%;
 background:#e5e9e5;display:flex;
 align-items:center;justify-content:center;
 margin:auto;position:relative;z-index:1;
 font-size:9px;font-weight:800
}
.step.done .dot{background:var(--green);color:white}
.step.current .dot{background:#222;color:white}
.step small{font-size:8px;color:var(--muted)}

.history{
 padding:10px 0;border-bottom:1px solid var(--line)
}
.history:last-child{border:0}
.history b{font-size:11px}
.history small{display:block;color:var(--muted);font-size:9px}

.empty{
 text-align:center;color:var(--muted);
 padding:35px 10px;font-size:12px
}

.toast{
 position:fixed;bottom:20px;left:50%;
 transform:translateX(-50%);
 background:#202620;color:white;padding:11px 20px;
 border-radius:30px;font-size:12px;
 opacity:0;pointer-events:none;transition:.25s;
 z-index:999
}
.toast.show{opacity:1}

.back{
 cursor:pointer;color:var(--muted);
 font-size:12px;font-weight:700;margin-bottom:12px
}

@media(max-width:600px){
 .grid3{grid-template-columns:1fr 1fr}
 .item{grid-template-columns:1fr 60px 75px 28px}
 .stats{gap:6px}
 .stat{padding:11px 5px}
}
</style>
</head>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================
   RASRAS ERP FRONTEND
========================= */

const TOKEN_KEY = "rasras_erp_token";

let TOKEN = sessionStorage.getItem(TOKEN_KEY) || "";
let DATA = {
 orders:[],
 customers:[],
 suppliers:[],
 users:[],
 warehouses:[],
 items:[],
 auditLog:[]
};

let state = {
 user:null,
 view:"dashboard",
 selected:null,
 orderType:"sale",
 draft:null,
 error:"",
 search:""
};

const ROLES = {
 admin:"صاحب المؤسسة",
 sales:"مدير المبيعات",
 accounts:"مدير الحسابات",
 warehouse:"مدير المخازن"
};

const STAGES = [
 ["sales_created","إنشاء الأمر"],
 ["logistics_review","النقل"],
 ["accounts_approval","الحسابات"],
 ["warehouse_release","المخازن"],
 ["with_driver","السائق"],
 ["delivered","تم التسليم"]
];

function esc(v){
 return String(v ?? "")
 .replace(/[&<>"']/g,x=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[x]));
}

function money(v){
 return Number(v||0).toLocaleString("ar-EG")+" ج.م";
}

function date(v){
 if(!v)return "—";
 return new Date(v).toLocaleDateString("ar-EG",{
  year:"numeric",month:"short",day:"numeric"
 });
}

function toast(msg){
 const t=document.getElementById("toast");
 t.textContent=msg;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2300);
}

async function api(url,options={}){
 options.headers={
  ...(options.headers||{}),
  "Content-Type":"application/json"
 };

 if(TOKEN){
  options.headers.Authorization="Bearer "+TOKEN;
 }

 const res=await fetch(url,options);

 if(res.status===401){
  TOKEN="";
  sessionStorage.removeItem(TOKEN_KEY);
  state.user=null;
  render();
  throw new Error("انتهت الجلسة");
 }

 const data=await res.json().catch(()=>({}));

 if(!res.ok){
  throw new Error(data.error||"حدث خطأ");
 }

 return data;
}

/* =========================
   AUTH
========================= */

async function login(){
 const username=document.getElementById("username").value.trim();
 const password=document.getElementById("password").value;

 state.error="";

 if(!username||!password){
  state.error="اكتب اسم المستخدم وكلمة المرور";
  render();
  return;
 }

 try{
  const result=await api("/api/auth/login",{
   method:"POST",
   body:JSON.stringify({username,password})
  });

  TOKEN=result.token;
  sessionStorage.setItem(TOKEN_KEY,TOKEN);
  state.user=result.user;

  await loadData();

  state.view="dashboard";
  render();
 }catch(e){
  state.error=e.message;
  render();
 }
}

async function restoreSession(){
 if(!TOKEN){
  render();
  return;
 }

 try{
  const me=await api("/api/auth/me");
  state.user=me.user;
  await loadData();
  render();
 }catch(e){
  TOKEN="";
  sessionStorage.removeItem(TOKEN_KEY);
  render();
 }
}

async function logout(){
 try{
  await api("/api/auth/logout",{method:"POST"});
 }catch(e){}

 TOKEN="";
 sessionStorage.removeItem(TOKEN_KEY);
 state.user=null;
 state.view="dashboard";
 render();
}

/* =========================
   DATA
========================= */

async function loadData(){
 const result=await api("/api/data");

 DATA={
  orders:result.orders||[],
  customers:result.customers||[],
  suppliers:result.suppliers||[],
  users:result.users||[],
  warehouses:result.warehouses||[],
  items:result.items||[],
  auditLog:result.auditLog||[]
 };
}

async function saveData(){
 try{
  await api("/api/data",{
   method:"POST",
   body:JSON.stringify(DATA)
  });
  return true;
 }catch(e){
  toast(e.message);
  return false;
 }
}

/* =========================
   UI
========================= */

function loginHTML(){
 return `
 <div class="login">
  <div class="login-card">
   <div class="logo">RR</div>

   <h1>RASRAS PLASTIC</h1>
   <div class="sub">نظام ERP لإدارة المبيعات والمخازن والحسابات</div>

   <label>اسم المستخدم</label>
   <input id="username" autocomplete="username"
          placeholder="اسم المستخدم">

   <label>كلمة المرور</label>
   <input id="password" type="password"
          autocomplete="current-password"
          placeholder="كلمة المرور">

   <button class="btn primary full"
           style="margin-top:18px"
           onclick="login()">
    تسجيل الدخول
   </button>

   <div class="error ${state.error?"show":""}">
    ${esc(state.error)}
   </div>

   <div style="font-size:10px;color:#899389;margin-top:18px">
    نظام RASRAS PLASTIC ERP
   </div>
  </div>
 </div>`;
}

function header(){
 const u=state.user;

 return `
 <div class="header">
  <div class="brand">
   <div class="brand-logo">RR</div>
   <div>
    <div class="brand-title">RASRAS PLASTIC</div>
    <div class="brand-sub">نظام إدارة المؤسسة</div>
   </div>
  </div>

  <button class="user"
          onclick="logout()">
   ${esc(u.name)}
   <span class="role">${ROLES[u.role]||u.role}</span>
  </button>
 </div>`;
}

function tabs(){
 const r=state.user.role;
 let arr=[
  ["dashboard","الرئيسية"]
 ];

 if(r==="admin"||r==="sales"){
  arr.push(["new","أمر جديد"]);
 }

 arr.push(["orders","الأوامر"]);
 arr.push(["customers","العملاء"]);

 if(r==="admin"){
  arr.push(["users","المستخدمين"]);
  arr.push(["audit","سجل العمليات"]);
 }

 return `
 <div class="tabs">
 ${arr.map(x=>`
  <button class="tab ${state.view===x[0]?"active":""}"
          onclick="go('${x[0]}')">
   ${x[1]}
  </button>
 `).join("")}
 </div>`;
}

function go(v){
 state.view=v;
 state.selected=null;

 if(v==="new"){
  state.orderType="sale";
  state.draft=newDraft("sale");
 }

 render();
}

/* =========================
   DASHBOARD
========================= */

function dashboard(){
 const total=DATA.orders.length;
 const active=DATA.orders.filter(x=>x.stage!=="delivered").length;
 const delivered=DATA.orders.filter(x=>x.stage==="delivered").length;
 const sales=DATA.orders.filter(x=>x.type==="sale").length;
 const purchases=DATA.orders.filter(x=>x.type==="purchase").length;

 return `
 <div class="stats">
  <div class="stat">
   <b>${total}</b><span>إجمالي الأوامر</span>
  </div>
  <div class="stat">
   <b>${active}</b><span>قيد التنفيذ</span>
  </div>
  <div class="stat">
   <b>${delivered}</b><span>تم التسليم</span>
  </div>
 </div>

 <div class="stats">
  <div class="stat">
   <b>${sales}</b><span>أوامر البيع</span>
  </div>
  <div class="stat">
   <b>${purchases}</b><span>أوامر الشراء</span>
  </div>
  <div class="stat">
   <b>${DATA.customers.length}</b><span>العملاء</span>
  </div>
 </div>

 <div class="title">آخر الأوامر</div>

 ${DATA.orders.length
  ?DATA.orders.slice(0,10).map(orderHTML).join("")
  :`<div class="card empty">لا توجد أوامر حتى الآن</div>`
 }
 `;
}

/* =========================
   ORDERS
========================= */

function stageName(stage){
 const x=STAGES.find(s=>s[0]===stage);
 return x?x[1]:stage;
}

function badge(stage){
 let cls="b-gray";

 if(stage==="accounts_approval")cls="b-orange";
 if(stage==="warehouse_release")cls="b-blue";
 if(stage==="delivered")cls="b-dark";
 if(stage==="logistics_review")cls="b-green";
 if(stage==="with_driver")cls="b-blue";

 return `<span class="badge ${cls}">${stageName(stage)}</span>`;
}

function orderHTML(o){
 const total=o.finalTotal||
  (o.items||[]).reduce((s,i)=>
   s+(Number(i.qty)||0)*(Number(i.price)||0),0)
  +(Number(o.shippingCost)||0);

 return `
 <div class="order" onclick="openOrder('${esc(o.id)}')">
  <div class="order-head">
   <div>
    <div class="order-id">${esc(o.id)} · ${o.type==="sale"?"بيع":"شراء"}</div>
    <div class="order-name">${esc(o.partyName)}</div>
    <div class="order-meta">
     ${date(o.createdAt)} · ${money(total)}
    </div>
   </div>
   ${badge(o.stage)}
  </div>
 </div>`;
}

function orders(){
 let list=DATA.orders;

 if(state.user.role!=="admin"){
  const stage={
   accounts:"accounts_approval",
   warehouse:"warehouse_release"
  }[state.user.role];

  if(stage){
   const pending=list.filter(x=>x.stage===stage);
   if(pending.length)list=pending;
  }
 }

 return `
 <div class="title">
  <span>الأوامر</span>
  <span style="font-size:10px;color:var(--muted)">
   ${list.length} أمر
  </span>
 </div>

 ${list.length
  ?list.map(orderHTML).join("")
  :`<div class="card empty">لا توجد أوامر</div>`
 }`;
}

/* =========================
   NEW ORDER
========================= */

function newDraft(type){
 return {
  id:(type==="sale"?"SO-":"PO-")+
     Math.floor(10000+Math.random()*89999),
  type,
  partyName:"",
  phone:"",
  address:"",
  taxInvoice:false,
  paymentMethod:"نقدي",
  items:[{name:"",qty:1,price:0}],
  shippingCost:null,
  finalTotal:null,
  stage:"sales_created",
  driverName:"",
  driverPhone:"",
  createdBy:state.user.name,
  createdAt:new Date().toISOString(),
  history:[]
 };
}

function newOrder(){
 const d=state.draft||newDraft(state.orderType);

 return `
 <div class="card">

  <div class="segment">
   <button class="${state.orderType==="sale"?"active":""}"
           onclick="changeType('sale')">
    أمر بيع
   </button>

   <button class="${state.orderType==="purchase"?"active":""}"
           onclick="changeType('purchase')">
    أمر شراء
   </button>
  </div>

  <label>${d.type==="sale"?"اسم العميل":"اسم المورد"}</label>
  <input id="partyName" value="${esc(d.partyName)}"
         placeholder="الاسم">

  <div class="grid2">
   <div>
    <label>رقم التليفون</label>
    <input id="partyPhone" value="${esc(d.phone)}"
           placeholder="01xxxxxxxxx">
   </div>

   <div>
    <label>فاتورة ضريبية</label>
    <div class="segment">
     <button class="${d.taxInvoice?"active":""}"
             onclick="setTax(true)">نعم</button>
     <button class="${!d.taxInvoice?"active":""}"
             onclick="setTax(false)">لا</button>
    </div>
   </div>
  </div>

  <label>العنوان</label>
  <input id="partyAddress" value="${esc(d.address)}"
         placeholder="العنوان">

  <label>طريقة الدفع</label>
  <div class="segment">
   ${["نقدي","شيك","تحويل بنكي","آجل"].map(x=>`
    <button class="${d.paymentMethod===x?"active":""}"
            onclick="setPay('${x}')">
     ${x}
    </button>
   `).join("")}
  </div>
 </div>

 <div class="card">
  <div class="title">الأصناف</div>

  <div id="items">
   ${d.items.map((x,i)=>`
    <div class="item">
     <input data-item="${i}" data-field="name"
            value="${esc(x.name)}"
            placeholder="الصنف">

     <input data-item="${i}" data-field="qty"
            type="number" min="0"
            value="${x.qty}">

     <input data-item="${i}" data-field="price"
            type="number" min="0"
            value="${x.price}">

     <button class="remove"
             onclick="removeItem(${i})">×</button>
    </div>
   `).join("")}
  </div>

  <button class="btn secondary full"
          onclick="addItem()">
   + إضافة صنف
  </button>

  <div class="total">
   <span>إجمالي الأصناف</span>
   <b>${money(itemsTotal(d))}</b>
  </div>
 </div>

 <button class="btn primary full"
         onclick="submitOrder()">
  إنشاء الأمر
 </button>
 `;
}

function changeType(type){
 state.orderType=type;
 state.draft=newDraft(type);
 render();
}

function setTax(v){
 state.draft.taxInvoice=v;
 render();
}

function setPay(v){
 state.draft.paymentMethod=v;
 render();
}

function addItem(){
 state.draft.items.push({
  name:"",qty:1,price:0
 });
 render();
}

function removeItem(i){
 if(state.draft.items.length<=1)return;
 state.draft.items.splice(i,1);
 render();
}

function itemsTotal(o){
 return (o.items||[]).reduce((s,i)=>
  s+(Number(i.qty)||0)*(Number(i.price)||0),0);
}

async function submitOrder(){
 const d=state.draft;

 d.partyName=document.getElementById("partyName").value.trim();
 d.phone=document.getElementById("partyPhone").value.trim();
 d.address=document.getElementById("partyAddress").value.trim();

 document.querySelectorAll("[data-item]").forEach(el=>{
  const i=Number(el.dataset.item);
  const f=el.dataset.field;
  d.items[i][f]=f==="name"
   ?el.value
   :Number(el.value)||0;
 });

 if(!d.partyName){
  toast("اكتب اسم العميل أو المورد");
  return;
 }

 d.items=d.items.filter(x=>x.name.trim());

 if(!d.items.length){
  toast("أضف صنف واحد على الأقل");
  return;
 }

 d.history.push({
  stage:"sales_created",
  by:state.user.name,
  note:"تم إنشاء الأمر",
  at:new Date().toISOString()
 });

 d.stage="logistics_review";

 d.history.push({
  stage:"logistics_review",
  by:"النظام",
  note:"تم تحويل الأمر إلى النقل",
  at:new Date().toISOString()
 });

 DATA.orders.unshift(d);

 const arr=d.type==="sale"
  ?DATA.customers
  :DATA.suppliers;

 let p=arr.find(x=>
  x.name===d.partyName&&x.phone===d.phone
 );

 if(!p){
  p={
   name:d.partyName,
   phone:d.phone,
   address:d.address,
   orderIds:[]
  };
  arr.push(p);
 }

 p.orderIds=p.orderIds||[];
 p.orderIds.push(d.id);

 if(await saveData()){
  state.selected=d.id;
  state.draft=null;
  state.view="detail";
  toast("تم إنشاء الأمر");
  render();
 }
}

/* =========================
   DETAIL / APPROVALS
========================= */

function openOrder(id){
 state.selected=id;
 state.view="detail";
 render();
}

function detail(){
 const o=DATA.orders.find(x=>x.id===state.selected);

 if(!o){
  return `<div class="card empty">الأمر غير موجود</div>`;
 }

 const idx=STAGES.findIndex(x=>x[0]===o.stage);

 const total=o.finalTotal||
  itemsTotal(o)+(Number(o.shippingCost)||0);

 let action="";

 if(state.user.role==="accounts" &&
    o.stage==="accounts_approval"){
  action=`
  <div class="card">
   <b>اعتماد الحسابات</b>

   <label>السعر النهائي</label>
   <input id="finalTotal"
          type="number"
          value="${total}">

   <label>ملاحظة</label>
   <input id="accountNote">

   <button class="btn primary full"
           style="margin-top:14px"
           onclick="approveAccounts()">
    اعتماد وتحويل للمخازن
   </button>
  </div>`;
 }

 if(state.user.role==="warehouse" &&
    o.stage==="warehouse_release"){
  action=`
  <div class="card">
   <b>إذن صرف المخازن</b>

   <label>اسم السائق</label>
   <input id="driverName">

   <label>رقم السائق</label>
   <input id="driverPhone">

   <button class="btn primary full"
           style="margin-top:14px"
           onclick="releaseWarehouse()">
    إصدار إذن الصرف
   </button>
  </div>`;
 }

 if(state.user.role==="admin"){
  if(o.stage==="accounts_approval"){
   action=`
   <div class="card">
    <b>اعتماد الحسابات — المدير</b>
    <button class="btn primary full"
            style="margin-top:12px"
            onclick="adminApproveAccounts()">
     اعتماد
    </button>
   </div>`;
  }

  if(o.stage==="warehouse_release"){
   action=`
   <div class="card">
    <b>اعتماد المخازن — المدير</b>
    <button class="btn primary full"
            style="margin-top:12px"
            onclick="adminRelease()">
     إصدار إذن الصرف
    </button>
   </div>`;
  }

  if(o.stage==="with_driver"){
   action=`
   <div class="card">
    <b>تأكيد التسليم</b>
    <button class="btn primary full"
            style="margin-top:12px"
            onclick="deliverOrder()">
     تم التسليم
    </button>
   </div>`;
  }
 }

 return `
 <div class="back" onclick="go('orders')">← رجوع للأوامر</div>

 <div class="card">
  <div class="order-head">
   <div>
    <div class="order-id">${esc(o.id)}</div>
    <div class="order-name">${esc(o.partyName)}</div>
   </div>
   ${badge(o.stage)}
  </div>

  <div class="steps">
   ${STAGES.map((s,i)=>`
    <div class="step ${i<idx?"done":""}
         ${i===idx?"current":""}">
     <div class="dot">${i<idx?"✓":i+1}</div>
     <small>${s[1]}</small>
    </div>
   `).join("")}
  </div>

  <div class="grid2">
   <div class="card" style="margin:0">
    <small>التليفون</small><br>
    <b>${esc(o.phone||"—")}</b>
   </div>

   <div class="card" style="margin:0">
    <small>طريقة الدفع</small><br>
    <b>${esc(o.paymentMethod)}</b>
   </div>

   <div class="card" style="margin:0">
    <small>فاتورة ضريبية</small><br>
    <b>${o.taxInvoice?"نعم":"لا"}</b>
   </div>

   <div class="card" style="margin:0">
    <small>تكلفة النقل</small><br>
    <b>${o.shippingCost==null?"لم تحدد":money(o.shippingCost)}</b>
   </div>
  </div>

  <div class="title">الأصناف</div>

  ${(o.items||[]).map(x=>`
   <div class="order-meta"
        style="display:flex;justify-content:space-between">
    <span>${esc(x.name)} × ${x.qty}</span>
    <b>${money(x.qty*x.price)}</b>
   </div>
  `).join("")}

  <div class="total">
   <span>الإجمالي</span>
   <b>${money(total)}</b>
  </div>
 </div>

 ${action}

 <div class="title">سجل الحركة</div>

 <div class="card">
  ${(o.history||[]).slice().reverse().map(h=>`
   <div class="history">
    <b>${esc(h.note)}</b>
    <small>${esc(h.by)} · ${date(h.at)}</small>
   </div>
  `).join("")}
 </div>
 `;
}

async function approveAccounts(){
 const o=DATA.orders.find(x=>x.id===state.selected);
 const total=Number(document.getElementById("finalTotal").value)||0;
 const note=document.getElementById("accountNote").value;

 o.finalTotal=total;
 o.stage="warehouse_release";

 o.history.push({
  stage:"accounts_approval",
  by:state.user.name,
  note:"تم اعتماد السعر النهائي "+money(total)+
       (note?" — "+note:""),
  at:new Date().toISOString()
 });

 o.history.push({
  stage:"warehouse_release",
  by:"النظام",
  note:"تم تحويل الأمر للمخازن",
  at:new Date().toISOString()
 });

 if(await saveData()){
  toast("تم الاعتماد");
  render();
 }
}

async function adminApproveAccounts(){
 const o=DATA.orders.find(x=>x.id===state.selected);

 o.finalTotal=o.finalTotal||
  itemsTotal(o)+(Number(o.shippingCost)||0);

 o.stage="warehouse_release";

 o.history.push({
  stage:"accounts_approval",
  by:state.user.name,
  note:"تم اعتماد الحسابات بواسطة المدير",
  at:new Date().toISOString()
 });

 if(await saveData()){
  toast("تم الاعتماد");
  render();
 }
}

async function releaseWarehouse(){
 const o=DATA.orders.find(x=>x.id===state.selected);

 o.driverName=document.getElementById("driverName").value.trim();
 o.driverPhone=document.getElementById("driverPhone").value.trim();

 o.stage="with_driver";

 o.history.push({
  stage:"warehouse_release",
  by:state.user.name,
  note:"تم إصدار إذن الصرف وتسليم الأمر للسائق "+
       (o.driverName||""),
  at:new Date().toISOString()
 });

 if(await saveData()){
  toast("تم إصدار إذن الصرف");
  render();
 }
}

async function adminRelease(){
 const o=DATA.orders.find(x=>x.id===state.selected);

 o.stage="with_driver";

 o.history.push({
  stage:"warehouse_release",
  by:state.user.name,
  note:"تم إصدار إذن الصرف بواسطة المدير",
  at:new Date().toISOString()
 });

 if(await saveData()){
  toast("تم إصدار إذن الصرف");
  render();
 }
}

async function deliverOrder(){
 const o=DATA.orders.find(x=>x.id===state.selected);

 o.stage="delivered";

 o.history.push({
  stage:"delivered",
  by:state.user.name,
  note:"تم تسجيل التسليم",
  at:new Date().toISOString()
 });

 if(await saveData()){
  toast("تم تسجيل التسليم");
  render();
 }
}

/* =========================
   CUSTOMERS
========================= */

function customers(){
 const all=[
  ...DATA.customers.map(x=>({...x,type:"عميل"})),
  ...DATA.suppliers.map(x=>({...x,type:"مورد"}))
 ];

 return `
 <input placeholder="بحث بالاسم أو الهاتف"
        value="${esc(state.search)}"
        oninput="state.search=this.value;render()">

 <div class="title">العملاء والموردين</div>

 ${all.filter(x=>
  !state.search ||
  x.name?.includes(state.search) ||
  x.phone?.includes(state.search)
 ).map(x=>`
  <div class="card">
   <b>${esc(x.name)}</b>
   <div class="order-meta">
    ${x.type} · ${esc(x.phone||"—")}
   </div>
   <div class="order-meta">
    ${esc(x.address||"لا يوجد عنوان")}
   </div>
  </div>
 `).join("")||`
 <div class="card empty">لا توجد نتائج</div>
 `}
 `;
}

/* =========================
   USERS
========================= */

function users(){
 return `
 <div class="card">
  <b>إضافة مستخدم</b>

  <label>اسم الموظف</label>
  <input id="newName">

  <label>اسم المستخدم</label>
  <input id="newUsername">

  <label>كلمة المرور</label>
  <input id="newPassword" type="password">

  <label>الصلاحية</label>
  <select id="newRole">
   <option value="sales">مدير المبيعات</option>
   <option value="accounts">مدير الحسابات</option>
   <option value="warehouse">مدير المخازن</option>
   <option value="admin">صاحب المؤسسة</option>
  </select>

  <button class="btn primary full"
          style="margin-top:14px"
          onclick="addUser()">
   إضافة المستخدم
  </button>
 </div>

 <div class="title">
  المستخدمون (${DATA.users.length})
 </div>

 <div class="card">
 ${DATA.users.map(u=>`
  <div class="history">
   <b>${esc(u.name)}</b>
   <small>
    ${esc(u.username)} · ${ROLES[u.role]||u.role}
   </small>
  </div>
 `).join("")}
 </div>
 `;
}

async function addUser(){
 const name=document.getElementById("newName").value.trim();
 const username=document.getElementById("newUsername").value.trim();
 const password=document.getElementById("newPassword").value;
 const role=document.getElementById("newRole").value;

 if(!name||!username||!password){
  toast("أكمل بيانات المستخدم");
  return;
 }

 if(DATA.users.some(x=>
  x.username.toLowerCase()===username.toLowerCase()
  )){
  toast("اسم المستخدم موجود بالفعل");
  return;
 }

 DATA.users.push({
  id:"U-"+Date.now(),
  name,
  username,
  password,
  role,
  active:true,
  createdAt:new Date().toISOString()
 });

 if(await saveData()){
  toast("تمت إضافة المستخدم");
  render();
 }
}

/* =========================
   AUDIT
========================= */

function audit(){
 return `
 <div class="title">سجل العمليات</div>

 <div class="card">
 ${DATA.auditLog.length
  ?DATA.auditLog.slice().reverse().map(x=>`
   <div class="history">
    <b>${esc(x.action)}</b>
    <small>
     ${esc(x.userName)} ·
     ${esc(x.entity||"")} ·
     ${date(x.createdAt)}
    </small>
   </div>
  `).join("")
  :`<div class="empty">لا يوجد سجل عمليات</div>`
 }
 </div>`;
}

/* =========================
   RENDER
========================= */

function render(){
 const app=document.getElementById("app");

 if(!state.user){
  app.innerHTML=loginHTML();

  const u=document.getElementById("username");
  const p=document.getElementById("password");

  if(u)u.addEventListener("keydown",
   e=>{if(e.key==="Enter")login()});

  if(p)p.addEventListener("keydown",
   e=>{if(e.key==="Enter")login()});

  return;
 }

 let content="";

 switch(state.view){
  case"dashboard":content=dashboard();break;
  case"new":content=newOrder();break;
  case"orders":content=orders();break;
  case"customers":content=customers();break;
  case"users":content=users();break;
  case"audit":content=audit();break;
  case"detail":content=detail();break;
  default:content=dashboard();
 }

 app.innerHTML=
  `<div class="app">
   ${header()}
   ${tabs()}
   ${content}
  </div>`;
}

restoreSession();

</script>
</body>
</html>
